            Dispatching takes the goods from the sending site, soonest-expiring first. When they arrive, the receiving
            site enters what actually came; any shortage is logged in Stock Movements as lost.
            New donations go to the Central Warehouse.
          </div>`;
      },

      "Stock Movements"() {
        const rows = M.map(m => `
          <tr>
            <td>${m.date}</td>
            <td>${esc(m.item)}</td>
            <td>${esc(m.site)}</td>
            <td>${MOVES[m.kind] || m.kind}</td>
            <td style="color:${m.q < 0 ? "var(--p1)" : "var(--ok)"}"><b>${m.q > 0 ? "+" : ""}${m.q} ${m.unit}</b></td>
            <td style="white-space:normal">${esc(m.reason)}</td>
            <td style="color:var(--mu)">${esc(m.by)}</td>
          </tr>`).join("");

        return `
          <div class="top">
            <span style="color:var(--mu)">Every stock change that isn't a donation or a distribution, with who did it and why.</span>
            ${logi() ? '<button class="btn a" onclick="addAdj()">+ Stock adjustment</button>' : ""}
          </div>

          <div class="card tw">
            <table>
              <tr><th>Date</th><th>Item</th><th>Site</th><th>Type</th><th>Change</th><th>Reason</th><th>By</th></tr>
              ${rows || `<tr><td colspan="7" style="color:var(--mu)">No adjustments yet.</td></tr>`}
            </table>
          </div>`;
      },

      "Distribution History"() {
        const rows = D
          .map(d => `<tr><td>${d.date}</td><td>${esc(d.ben)}</td><td>${esc(d.items)}</td><td>${d.by}</td></tr>`)
          .join("");

        return `
          <div class="card tw">
            <table>
              <tr><th>Date</th><th>Beneficiary</th><th>Goods given</th><th>Processed by</th></tr>
              ${rows}
            </table>
          </div>`;
      },

      Reports() {
        const buttons = ["Beneficiary", "Sponsor", "Inventory", "Stock movement", "Donation", "Distribution"]
          .filter(r => (r !== "Beneficiary" || people()) && (r !== "Stock movement" || M.length || logi()))
          .map(r => `<button class="btn o" onclick="rep('${r}')">${r} report</button>`)
          .join("");

        return `
          <div class="grid">${buttons}</div>
          <div id="rp" class="card" style="display:none"></div>`;
      },

      Users() {
        const pending = A.filter(a => a.st === "Pending");

        const rows = A.map(a => {
          const id = a.idt ? a.idt.split(" ")[0] + " " + mask(a.idn) : "On file";
          const qrTag = a.qr ? ` <span class="tag t3" title="Details filled from the PhilSys QR code">QR</span>` : "";
          return `
            <tr>
              <td>${esc(a.name)}</td>
              <td>${a.u}</td>
              <td>${a.role}</td>
              <td>${id}${qrTag}</td>
              <td>${a.st}</td>
              <td>${userActions(a)}</td>
            </tr>`;
        }).join("");

        // Forgot-password requests: the Admin checks the person's ID, then sets a temporary password
        const resets = R.map(r => {
          const a = A.find(x => x.id === r.user_id) || {};
          return `
            <tr>
              <td>${esc(a.name)}</td>
              <td>${esc(a.u)}</td>
              <td>${new Date(r.created_at).toLocaleString()}</td>
              <td style="white-space:normal">${esc(r.note) || '<span style="color:var(--mu)">—</span>'}</td>
              <td>
                <button class="btn s" onclick="resetPw('${r.user_id}')">Reset password</button>
                <button class="btn o s" onclick="dismissReset(${r.id})">Dismiss</button>
              </td>
            </tr>`;
        }).join("");

        return `
          ${R.length ? `
            <div class="card warn tw">
              <b>${R.length} password reset request(s)</b>
              <span style="color:var(--mu)">· Check the person's valid ID before resetting.</span>
              <table>
                <tr><th>Name</th><th>Username</th><th>Requested</th><th>Message</th><th></th></tr>
                ${resets}
              </table>
            </div>` : ""}
          ${pending.length ? `<div class="card warn"><b>${pending.length} account(s) waiting for approval</b></div>` : ""}
          <div class="card tw">
            <table>
              <tr><th>Name</th><th>Username</th><th>Role</th><th>ID submitted</th><th>Status</th><th></th></tr>
              ${rows}
            </table>
          </div>`;
      }
    };

    // Buttons in the Users table: approve/reject new accounts, or turn existing ones on/off
    function userActions(a) {
      if (a.st === "Pending") {
        return `<button class="btn s" onclick="setSt('${a.id}','Active')">Approve</button>
                <button class="btn o s" onclick="setSt('${a.id}','Rejected')">Reject</button>`;
      }
      if (a.id === me) return "";   // can't deactivate yourself

      const next = a.st === "Active" ? "Deactivated" : "Active";
      const label = a.st === "Active" ? "Deactivate" : "Activate";
      return `<button class="btn o s" onclick="setSt('${a.id}','${next}')">${label}</button>`
        + (a.st === "Active" ? ` <button class="btn o s" onclick="resetPw('${a.id}')">Reset password</button>` : "");
    }

    // Temporary password: 10 characters without look-alikes (0/O, 1/l/I), easy to read out loud
    function tempPw() {
      const chars = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      return [...crypto.getRandomValues(new Uint32Array(10))].map(n => chars[n % chars.length]).join("");
    }

    function resetPw(id) {
      const a = A.find(x => x.id === id);
      const pw = tempPw();
      modal(`
        <h3>Reset password · ${esc(a.name)}</h3>
        <p style="color:var(--mu)">${esc(a.u)} · ${a.role} · ID on file: ${a.idt ? esc(a.idt) + " " + mask(a.idn) : "none"}</p>

        <div class="cks one">
          <label><input type="checkbox" id="rp_ok">
            <span><b>I checked this person's valid ID in person</b><br>
            <span style="color:var(--mu)">It matches the name and ID on file. Never reset a password over chat or text.</span></span></label>
        </div>

        <label>Temporary password</label>
        <input id="rp_pw" value="${pw}" readonly style="font:600 20px/1.2 ui-monospace,Consolas,monospace;letter-spacing:2px">
        <div class="note">Give it to them in person. They must choose their own password when they log in with it.</div>
        <div class="err" id="rp_err"></div>

        <div class="actions">
          <button class="btn a" onclick="doReset('${id}')">Set temporary password</button>
          <button class="btn o" onclick="$('rp_pw').value = tempPw()">New one</button>
          <button class="btn o" onclick="close_()">Cancel</button>
        </div>`);
    }

    async function doReset(id) {
      if (!$("rp_ok").checked) return ($("rp_err").textContent = "Check their ID first.");
      const pw = $("rp_pw").value, a = A.find(x => x.id === id);

      if (!(await act(sb.rpc("admin_reset_password", { p_user: id, p_temp: pw })))) return;

      // Show the password one last time, big enough to read out
      modal(`
        <h3>Temporary password set</h3>
        <p>Give this to <b>${esc(a.name)}</b> (${esc(a.u)}):</p>
        <div style="font:700 28px/1.3 ui-monospace,Consolas,monospace;letter-spacing:3px;text-align:center;
                    padding:14px;border:2px dashed var(--ac);border-radius:10px">${esc(pw)}</div>
        <div class="note">It isn't saved anywhere you can see again. They'll choose their own password when they log in.</div>
        <div class="actions"><button class="btn a" onclick="close_(); go('Users')">Done</button></div>`);
    }

    async function dismissReset(id) {
      if (!confirm("Dismiss this request without resetting the password?")) return;
      if (await act(sb.from("reset_requests").update({ status: "Dismissed", handled_by: me, handled_at: new Date().toISOString() })
        .eq("id", id), "Request dismissed")) go("Users");
    }

    async function setSt(id, status) {
      if (await act(sb.from("profiles").update({ status }).eq("id", id), "Account " + status.toLowerCase())) go("Users");
    }

    // Verification: the verifier ticks each proof they actually saw. Must be a different person
    // from whoever registered the record.
    function ver(id) {
      const b = B.find(x => x.id === id);
      if (b.byId === me) return toast("You registered this person. Another LGU or Admin must verify them");

      const proofs = cats(b).filter(c => c !== REG).map(c => `
        <label><input type="checkbox" class="pf" value="${c}">
          <span><b>${c}</b><br><span style="color:var(--mu)">${PROOF[c]}</span></span></label>`).join("");

      const warnings = b.flags.length ? `
        <div class="card warn" style="margin:12px 0 0">
          <b>Warnings</b>
          <ul style="margin:6px 0">${b.flags.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
          <div class="cks one"><label><input type="checkbox" id="vf"> I checked these warnings against the documents</label></div>
        </div>` : "";

      modal(`
        <h3>Verify ${esc(b.name)}</h3>
        <p style="color:var(--mu)">${esc(b.idt)} ${mask(b.idn)} · born ${b.dob} (age ${ageOf(b.dob)}) · registered by ${esc(b.by)}</p>

        <div class="cks one">
          <label><input type="checkbox" class="pf" value="ID">
            <span><b>Identity</b><br><span style="color:var(--mu)">The ID matches the person, their name and birthdate</span></span></label>
          ${proofs}
        </div>
        ${warnings}

        <div class="note">
          Untick any category with no proof. It will be removed from the record.
          Senior status comes from the birthdate, so if the age can't be proven, delete the record and register it again with the right birthdate.
        </div>
        <div class="err" id="verr"></div>

        <div class="actions">
          <button class="btn a" onclick="confirmVer(${id})">Verify</button>
          <button class="btn o" onclick="close_()">Cancel</button>
        </div>`);
    }

    async function confirmVer(id) {
      const b = B.find(x => x.id === id);
      const seen = [...document.querySelectorAll(".pf:checked")].map(x => x.value);
      const err = m => { $("verr").textContent = m; };

      if (!seen.includes("ID"))                          return err("Check the ID first. Without it the person can't join the queue.");
      if (cats(b).includes(SENIOR) && !seen.includes(SENIOR)) return err("No proof of age. Delete this record and register it again with the right birthdate.");
      if (b.flags.length && !$("vf").checked)            return err("Review the warnings first.");

      // The database keeps only the categories with proof and records who verified
      const removed = b.cats.filter(c => !seen.includes(c));
      const ok = await act(sb.rpc("verify_beneficiary", { ben_id: id, keep_cats: seen }),
        removed.length ? "Verified · removed (no proof): " + removed.join(", ") : "ID verified · added to priority queue");
      if (!ok) return;

      close_();
      go("Beneficiaries");
    }


    /* =========================================================
       FORMS & ACTIONS
       ========================================================= */

    // ----- Beneficiaries -----
    function addB() {
      // Senior is shown but locked: the birthdate ticks it. Regular household is implied when nothing is ticked.
      const categories = Object.keys(CAT).filter(c => c !== REG).map(c => c === SENIOR
        ? `<label class="off"><input type="checkbox" id="cSenior" disabled> ${c} (set from birthdate)</label>`
        : `<label><input type="checkbox" class="cat" value="${c}"> ${c}</label>`).join("");
      const incomes = INC.map((x, i) => `<option value="${i}">${x}</option>`).join("");
      const idTypes = IDS.map(x => `<option>${x}</option>`).join("");

      modal(`
        <h3>Register beneficiary</h3>

        <div class="two">
          <div><label>Full name</label><input id="f1"></div>
          <div>
            <label>Birthdate</label>
            <input id="f3" type="date" min="${minDob()}" max="${today()}" oninput="ageHint()">
            <div class="hint" id="ageH"></div>
          </div>
        </div>

        <label>Address / Barangay</label>
        <input id="f2">

        <div class="two">
          <div><label>Contact number (optional)</label><input id="f4"></div>
          <div><label>Family members</label><input id="f5" type="number" value="1" min="1" max="30"></div>
        </div>

        <label>Vulnerability categories (tick all that apply, leave empty for a regular household)</label>
        <div class="cks">${categories}</div>

        <label>Monthly household income</label>
        <select id="f7">${incomes}</select>

        <div class="two">
          <div><label>ID type</label><select id="f8">${idTypes}</select></div>
          <div><label>ID number</label><input id="f9"></div>
        </div>

        <div class="note">
          More high-priority needs rank higher, then lower household income.
          Every category needs proof when an LGU or Admin verifies the person.
        </div>

        <div class="actions">
          <button class="btn a" onclick="saveB()">Save</button>
          <button class="btn o" onclick="close_()">Cancel</button>
        </div>`);
    }

    // Shows the age as the birthdate is typed, and ticks the locked Senior box at 60+
    function ageHint() {
      const v = $("f3").value;
      const a = ageOf(v);
      const ok = !isNaN(a) && a >= 0 && a <= MAX_AGE;

      $("cSenior").checked = ok && a >= 60;
      $("ageH").style.color = v && !ok ? "var(--p1)" : "";
      $("ageH").textContent = !v ? ""
        : !ok ? "Not a realistic birthdate"
        : `Age ${a}${a >= 60 ? " · counts as senior" : ""}${a > 100 ? " · will be flagged for review" : ""}`;
    }

    async function saveB() {
      const name = $("f1").value.trim();
      const dob = $("f3").value;
      const age = ageOf(dob);
      const fam = +$("f5").value;
      const idNumber = $("f9").value.trim();

      if (!name || !idNumber)                          return toast("Name and ID number are required");
      if (isNaN(age))                                  return toast("Enter a valid birthdate");
      if (age < 0 || dob > today())                    return toast("Birthdate can't be in the future");
      if (age > MAX_AGE)                               return toast(`Birthdate is over ${MAX_AGE} years ago. Check the ID`);
      if (!Number.isInteger(fam) || fam < 1 || fam > 30) return toast("Family members must be a whole number from 1 to 30");

      // Same name + birthdate means this person is already registered. The database also
      // blocks a repeated ID number (the page only has the last 4 digits, so it can't check that itself).
      const key = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
      const dup = B.find(b => key(b.name) === key(name) && b.dob === dob);
      if (dup) return toast(`Already registered as ${dup.name}. Duplicates aren't allowed`);

      const b = {
        name,
        brgy: $("f2").value.trim() || "—",
        contact: $("f4").value.trim() || null,
        dob,
        fam,
        cats: [...document.querySelectorAll(".cat:checked")].map(x => x.value),
        inc: +$("f7").value,
        id_type: $("f8").value,
        id_no: idNumber,
        registered_by: me
      };
      const flagged = flagsOf({ ...b, idt: b.id_type }).length;

      const ok = await act(sb.from("beneficiaries").insert(b),
        flagged ? "Saved · flagged for review before verification" : "Saved · waiting for ID verification");
      if (!ok) return;

      close_();
      go("Beneficiaries");
    }

    async function delB(id) {
      if (!confirm("Delete " + B.find(b => b.id === id).name + "? This cannot be undone.")) return;

      if (await act(sb.from("beneficiaries").delete().eq("id", id), "Record deleted")) go("Beneficiaries");
    }

    // ----- Distribution -----
    // Other people who look like the same household (same contact number, or same surname in the same
    // barangay) and received relief this round. Only a warning: the distributor asks and decides.
    function household(b) {
      const phone = s => String(s || "").replace(/\D/g, "").slice(-10);
      const surname = s => String(s).trim().toLowerCase().split(/\s+/).pop();
      return B.filter(o => o.id !== b.id && o.last && !canServe(o)).map(o => {
        const why = phone(b.contact).length >= 7 && phone(o.contact) === phone(b.contact) ? "same contact number"
          : b.brgy !== "—" && o.brgy.toLowerCase() === b.brgy.toLowerCase() && surname(o.name) === surname(b.name) ? "same surname and barangay"
          : "";
        return why ? { ...o, why } : null;
      }).filter(Boolean);
    }

    // Admin: how many days before a family can receive again
    function setWait() {
      modal(`
        <h3>Days between relief packs</h3>
        <p style="color:var(--mu)">A family that received relief goes back into the queue after this many days.
          The database refuses to serve them again sooner, at every site.</p>
        <label>Days</label>
        <input id="wd" type="number" min="1" max="365" value="${WAIT}">
        <div class="actions">
          <button class="btn a" onclick="saveWait()">Save</button>
          <button class="btn o" onclick="close_()">Cancel</button>
        </div>`);
    }

    async function saveWait() {
      const d = +$("wd").value;
      if (!Number.isInteger(d) || d < 1 || d > 365) return toast("Enter a whole number of days from 1 to 365");
      if (!(await act(sb.from("app_settings").update({ serve_wait_days: d }).eq("id", 1), `Saved · families wait ${d} day${d > 1 ? "s" : ""}`))) return;
      close_();
      go("Priority Queue");
    }

    function serve(id, site) {
      if (site) serveSite = +site;
      const b = B.find(x => x.id == id);
      const here = x => remAt(x, serveSite);   // only the stock at the site where you're serving
      const sitePick = SITES.map(s => `<option value="${s.id}" ${s.id === serveSite ? "selected" : ""}>${esc(s.name)} · ${s.kind}</option>`).join("");
      // Per-person items are multiplied by the family size. Items without enough stock are skipped.
      const goods = given().map(x => {
        const amt = share(x, b.fam), short = here(x) < amt;
        return `
        <tr style="${short ? "opacity:.6" : ""}">
          <td>${esc(x.item)}</td>
          <td>${short ? "<s>" : ""}${amt} ${unit(x)}${short ? "</s>" : ""}
            ${x.basis === "person" ? `<span style="color:var(--mu);font-size:12px">(${x.per} × ${b.fam} people)</span>` : ""}</td>
          <td style="color:${short ? "var(--p1)" : "var(--mu)"}">${short ? "Not enough here · skipped" : here(x) + " " + unit(x) + " here"}</td>
        </tr>`;
      }).join("");
      const skipped = given().filter(x => here(x) < share(x, b.fam));
      const kin = household(b);

      modal(`
        <h3>Distribute relief goods</h3>
        <p>
          <b>${esc(b.name)}</b> ${tag(b)}<br>
          <span style="color:var(--mu)">${esc(b.brgy)} · ${b.idt.split(" ")[0]} ${mask(b.idn)} · family of ${b.fam}</span>
        </p>
        ${kin.length ? `<div class="card warn" style="margin:0 0 10px">
          <b>Possibly the same household already received relief</b><br>
          ${kin.map(o => `${esc(o.name)} · ${esc(o.brgy)} · served ${niceDate(o.last)}
            <span style="color:var(--mu)">(${o.why})</span>`).join("<br>")}<br>
          <span style="color:var(--mu);font-size:12px">Ask if they live together. If they do, skip this family until ${niceDate(nextServe(kin[0]))}.</span>
        </div>` : ""}

        <label>Serving at</label>
        <select onchange="serve(${id}, this.value)">${sitePick}</select>

        <table>${goods || `<tr><td style="color:var(--mu)">No items are set to be given out.</td></tr>`}</table>
        ${skipped.length ? `<div class="note">Out of stock for this family: <b>${skipped.map(x => esc(x.item)).join(", ")}</b>.
          They'll get everything else now. Ask Logistics to dispatch more to this site.</div>` : ""}

        <div class="actions">
          <button class="btn a" onclick="confirmServe(${id})">Confirm distribution</button>
          <button class="btn o" onclick="close_()">Cancel</button>
        </div>`);
    }

    async function confirmServe(id) {
      const b = B.find(x => x.id == id);
      if (!serveSite) return toast("Pick the site you're serving at");
      if (!given().some(x => remAt(x, serveSite) >= share(x, b.fam))) return toast(`Nothing in stock at ${siteName(serveSite)}`);

      // The database takes the stock soonest-expiring first, skips items that ran short,
      // marks the person served and saves the history in one step, so two people
      // serving at once can't give out the same stock
      if (busy) return;
      busy = true;
      let res;
      try { res = await sb.rpc("serve_beneficiary_at", { ben_id: id, p_site: serveSite }); }
      catch (e) { res = { error: { message: "Can't reach the database. Check your internet connection" } }; }
      finally { busy = false; }
      const { data: skipped, error } = res;
      if (error) {
        // Served at another site a moment ago: refresh so the card leaves the queue here too
        if (/already received/i.test(error.message)) { await load(); close_(); go("Priority Queue"); }
        return toast(errMsg(error));
      }
      await load();

      // Slide the card out, then refresh the queue
      close_();
      const card = $("q" + id);
      if (card) card.classList.add("out");
      setTimeout(() => {
        go("Priority Queue");
        toast(skipped ? "Recorded · skipped (out of stock): " + skipped : "Recorded · inventory updated");
      }, 450);
    }

    // ----- Inventory -----
    function addItem() {
      modal(`
        <h3>Add relief item</h3>
        <label>Item name</label>
        <input id="f1" placeholder="e.g. Milk">
        <label>Category (what it is for)</label>
        <select id="f3" onchange="$('f4').value = CAT_MEASURE[this.value]; $('f4').onchange(); $('f6').value = this.value === 'Clothing' ? 'person' : 'family'">${CATS.map(c => `<option>${c}</option>`).join("")}</select>
        <label>Counted by</label>
        <select id="f4" onchange="$('fu').textContent = MEASURES[this.value].base">
          ${Object.entries(MEASURES).map(([k, m]) => `<option value="${k}">${m.label} · ${m.base}</option>`).join("")}
        </select>
        <div class="two">
          <div>
            <label>Given</label>
            <select id="f6">
              <option value="family">Per family (e.g. 1 hygiene kit)</option>
              <option value="person">Per person (× family size, e.g. clothes)</option>
            </select>
          </div>
          <div>
            <label>Amount each (<span id="fu">kg</span>)</label>
            <input id="f2" type="number" value="1" min="0" step="any">
          </div>
        </div>
        <div class="cks one" style="margin-top:10px">
          <label><input type="checkbox" id="f5"> <span>Perishable · donations need an expiry date</span></label>
          <label><input type="checkbox" id="f7" checked> <span>Give out to families<br>
            <span style="color:var(--mu)">Untick for stock that must be sorted or repacked first, like unsorted clothes in sacks</span></span></label>
        </div>

        <div class="actions">
          <button class="btn a" onclick="saveItem()">Save</button>
          <button class="btn o" onclick="close_()">Cancel</button>
        </div>`);
      $("f3").onchange();   // start with the counting that fits the first category (Food → kg)
    }

    async function saveItem() {
      const name = $("f1").value.trim() || "Item";
      if (I.some(x => x.item.toLowerCase() === name.toLowerCase())) return toast("That item already exists");
      const per = +$("f2").value;
      if (!(per > 0)) return toast("Amount each must be more than 0");

      const ok = await act(sb.from("items").insert({
        name, cat: $("f3").value, measure: $("f4").value, perish: $("f5").checked, per: num(per),
        basis: $("f6").value, distribute: $("f7").checked
      }), "Item added");
      if (!ok) return;

      close_();
      go("Inventory");
    }

    // ----- Stock adjustments (Logistics & Admin) -----
    // id = item to adjust; leave it out to pick the item in the form
    function addAdj(id) {
      if (!I.length) return toast("Add a relief item first");
      if (!SITES.length) return toast("Add a site first");
      const items = I.map(x => `<option value="${x.id}" ${x.id === id ? "selected" : ""}>${esc(x.item)} (${rem(x)} ${unit(x)} in all)</option>`).join("");
      const kinds = HAND_ADJ.map(k => `<option value="${k}">${MOVES[k]}</option>`).join("");
      const sites = SITES.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");

      modal(`
        <h3>Stock adjustment</h3>
        <div class="two">
          <div><label>Item</label><select id="a1" onchange="adjForm()">${items}</select></div>
          <div><label>At site</label><select id="a6" onchange="adjForm()">${sites}</select></div>
        </div>
        <label>What happened</label>
        <select id="a2" onchange="adjForm()">${kinds}</select>
        <label>Amount (<span id="au"></span>)</label>
        <input id="a3" type="number" min="0" step="any" oninput="adjForm()">
        <div id="aex">
          <label>Expiry date of the extra stock</label>
          <input id="a5" type="date" min="${today()}">
        </div>
        <label>Reason (required)</label>
        <input id="a4" placeholder="e.g. 3 sacks soaked by flood water in Warehouse A">
        <div class="note" id="anote"></div>

        <div class="actions">
          <button class="btn a" onclick="saveAdj()">Save adjustment</button>
          <button class="btn o" onclick="close_()">Cancel</button>
        </div>`);
      // Start at the site that holds the most of this item
      const x = I.find(i => i.id === +$("a1").value);
      $("a6").value = [...SITES].sort((a, b) => remAt(x, b.id) - remAt(x, a.id))[0].id;
      adjForm();
    }

    // Shows the unit, the expiry field (only when adding perishable stock) and the result at the chosen site
    function adjForm() {
      const x = I.find(i => i.id === +$("a1").value), site = +$("a6").value, here = remAt(x, site);
      const add = $("a2").value === "recount_more";
      const q = num(+$("a3").value || 0);
      $("au").textContent = unit(x);
      $("aex").style.display = add && x.perish ? "" : "none";
      $("anote").innerHTML = !q ? `${esc(siteName(site))} has ${here} ${unit(x)} usable.`
        : !add && q > here ? `<span style="color:var(--p1)">Only ${here} ${unit(x)} usable at ${esc(siteName(site))}. You can't remove more than that.</span>`
        : `${esc(siteName(site))}: ${here} ${unit(x)} → <b>${num(here + (add ? q : -q))} ${unit(x)}</b>`
          + (add ? "" : " · taken from the soonest-expiring batch first");
    }

    async function saveAdj() {
      const x = I.find(i => i.id === +$("a1").value), site = +$("a6").value;
      const kind = $("a2").value, q = num(+$("a3").value), reason = $("a4").value.trim();
      const exp = kind === "recount_more" && x.perish ? $("a5").value : "";

      if (!(q > 0))                         return toast("Enter an amount above 0");
      if (kind !== "recount_more" && q > remAt(x, site)) return toast(`Only ${remAt(x, site)} ${unit(x)} usable at ${siteName(site)}`);
      if (!reason)                          return toast("Give a reason for the adjustment");
      if (kind === "recount_more" && x.perish && !exp) return toast("Perishable item · enter the expiry date");

      const ok = await act(sb.rpc("adjust_stock", { p_item: x.id, p_kind: kind, p_qty: q, p_reason: reason, p_site: site, p_exp: exp || null }),
        `${MOVES[kind]} · ${kind === "recount_more" ? "+" : "−"}${q} ${unit(x)} ${x.item} at ${siteName(site)}`);
      if (!ok) return;

      close_();
      go(cur);
    }

    async function writeOff() {
      const list = I.filter(x => spoiled(x) > 0).map(x => `${x.item} ${spoiled(x)} ${unit(x)}`).join(", ");
      if (!confirm(`Remove all expired stock from inventory?\n\n${list}\n\nOnly do this once it has been disposed of.`)) return;

      if (await act(sb.rpc("write_off_expired"), "Expired stock written off · logged in Stock Movements")) go(cur);
    }

    // Turns stock of one item into stock of others, e.g. 20 kg unsorted clothes → men's / women's / children's pieces,
    // or 50 kg bulk rice → 10 family rice packs. Each output is in its own item's unit.
    let sortSrc = null;   // item being sorted, so the "sorted into" lists leave it out

    function addSort(id) {
      const src = I.find(x => x.id === id);
      sortSrc = id;
      if (!rem(src)) return toast(`No usable ${src.item} to sort`);
      // Sites that have some of it, the one with the most first
      const at = SITES.filter(s => remAt(src, s.id) > 0).sort((a, b) => remAt(src, b.id) - remAt(src, a.id));
      if (!at.length) return toast(`All usable ${src.item} is in transit. Sort it after it arrives`);
      const others = I.filter(x => x.id !== id);
      if (!others.length) return toast("Add the items it will be sorted into first (e.g. Men's clothes)");

      // Suggest items of the same category first (unsorted clothes → the clothing items)
      const same = others.filter(x => x.cat === src.cat);
      const outs = (same.length ? same : others.slice(0, 1)).map(x => x.id);

      modal(`
        <h3>Sort / repack ${esc(src.item)}</h3>
        <div class="two">
          <div>
            <label>At site</label>
            <select id="s_site" onchange="$('s_q').value = remAt(I.find(x => x.id === sortSrc), +this.value); sortCalc()">
              ${at.map(s => `<option value="${s.id}">${esc(s.name)} (${remAt(src, s.id)} ${unit(src)})</option>`).join("")}
            </select>
          </div>
          <div>
            <label>Take (${unit(src)})</label>
            <input id="s_q" type="number" min="0" step="any" value="${remAt(src, at[0].id)}" oninput="sortCalc()">
          </div>
        </div>

        <label>Sorted into (leave 0 for any you didn't get)</label>
        <div id="s_rows">${outs.map(o => sortRow(o)).join("")}</div>
        <button class="btn o s" style="margin-top:6px" onclick="$('s_rows').insertAdjacentHTML('beforeend', sortRow())">+ Another item</button>

        <label>Note (required)</label>
        <input id="s_n" placeholder="e.g. Sorted by volunteers at Brgy. Sabang hall; 3 kg too damaged to use">
        <div class="note" id="s_sum"></div>

        <div class="actions">
          <button class="btn a" onclick="saveSort(${id})">Save sorting</button>
          <button class="btn o" onclick="close_()">Cancel</button>
        </div>`);
      sortCalc();
    }

    // One "sorted into" line: item + amount in that item's unit
    function sortRow(sel) {
      const opts = I.filter(x => x.id !== sortSrc)
        .map(x => `<option value="${x.id}" ${x.id === sel ? "selected" : ""}>${esc(x.item)} (${unit(x)})</option>`).join("");
      return `<div class="two s_row" style="margin-top:6px">
        <select class="s_i" onchange="sortCalc()">${opts}</select>
        <input class="s_v" type="number" min="0" step="any" value="0" oninput="sortCalc()">
      </div>`;
    }

    function sortRows() {
      return [...document.querySelectorAll(".s_row")]
        .map(r => ({ item_id: +r.querySelector(".s_i").value, qty: num(+r.querySelector(".s_v").value || 0) }))
        .filter(o => o.qty > 0);
    }

    function sortCalc() {
      const outs = sortRows();
      $("s_sum").innerHTML = outs.length
        ? "Adds: " + outs.map(o => { const x = I.find(i => i.id === o.item_id); return `<b>${o.qty} ${unit(x)}</b> ${esc(x.item)}`; }).join(", ")
        : "Enter how much of each item came out of the sorting.";
    }

    async function saveSort(id) {
      const src = I.find(x => x.id === id), site = +$("s_site").value;
      const q = num(+$("s_q").value), outs = sortRows(), note = $("s_n").value.trim();

      if (!(q > 0))        return toast("Enter how much was taken");
      if (q > remAt(src, site)) return toast(`Only ${remAt(src, site)} ${unit(src)} usable at ${siteName(site)}`);
      if (!outs.length)    return toast("Enter at least one item it was sorted into");
      if (new Set(outs.map(o => o.item_id)).size < outs.length) return toast("Each item can only be listed once");
      if (!note)           return toast("Add a note about the sorting");

      const ok = await act(sb.rpc("repack_stock", { p_from: id, p_qty: q, p_outputs: outs, p_note: note, p_site: site }),
        `Sorted ${q} ${unit(src)} ${src.item} into ${outs.length} item(s) at ${siteName(site)}`);
      if (!ok) return;

      close_();
      go(cur);
    }

    // Switches whether an item is handed to families
    async function setGive(id, on) {
      const x = I.find(i => i.id === id);
      if (on && x.basis === "person" && x.cat === "Clothing" &&
          !confirm(`${x.item} is given per person, to every member of every family, whatever their age or sex.\n\nTurn it on anyway?`)) return;

      if (await act(sb.from("items").update({ distribute: on }).eq("id", id),
        on ? `${x.item} is now given out` : `${x.item} is no longer given out`)) go(cur);
    }

    // ----- Sites -----
    function addSite() {
      modal(`
        <h3>Add site</h3>
        <label>Name</label>
        <input id="t1" placeholder="e.g. Antipolo Elementary School">
        <div class="two">
          <div><label>Type</label><select id="t2">${SITE_KINDS.map(k => `<option>${k}</option>`).join("")}</select></div>
          <div><label>Barangay</label><input id="t3" placeholder="e.g. Brgy. Antipolo"></div>
        </div>
        <div class="actions">
          <button class="btn a" onclick="saveSite()">Save</button>
          <button class="btn o" onclick="close_()">Cancel</button>
        </div>`);
    }

    async function saveSite() {
      const name = $("t1").value.trim();
      if (!name) return toast("Enter the site name");
      if (await act(sb.from("sites").insert({ name, kind: $("t2").value, brgy: $("t3").value.trim() || null }), "Site added")) {
        close_();
        go("Sites & Transfers");
      }
    }

    // ----- Dispatch (send goods from one site to another) -----
    function addTransfer() {
      if (SITES.length < 2) return toast("Add at least two sites first");
      const from = (SITES.find(s => s.kind === "Warehouse") || SITES[0]).id;
      const to = (SITES.find(s => s.id !== from && s.kind !== "Warehouse") || SITES.find(s => s.id !== from)).id;
      const opts = sel => SITES.map(s => `<option value="${s.id}" ${s.id === sel ? "selected" : ""}>${esc(s.name)}</option>`).join("");

      modal(`
        <h3>Dispatch goods</h3>
        <div class="two">
          <div><label>From</label><select id="d1" onchange="trRows()">${opts(from)}</select></div>
          <div><label>To</label><select id="d2">${opts(to)}</select></div>
        </div>

        <label>Goods (amount in each item's unit)</label>
        <div id="d_rows"></div>
        <button class="btn o s" style="margin-top:6px" onclick="$('d_rows').insertAdjacentHTML('beforeend', trRow())">+ Another item</button>

        <div class="two">
          <div><label>Vehicle</label><input id="d3" placeholder="e.g. LGU truck ABC 1234"></div>
          <div><label>Driver</label><input id="d4" placeholder="e.g. Mario Reyes"></div>
        </div>
        <label>Note (optional)</label>
        <input id="d5" placeholder="e.g. For the evacuees arriving tonight">

        <div class="actions">
          <button class="btn a" onclick="saveTransfer()">Dispatch</button>
          <button class="btn o" onclick="close_()">Cancel</button>
        </div>`);
      trRows();
    }

    // One goods line: only items the sending site has
    function trRow() {
      const from = +$("d1").value;
      const opts = I.filter(x => remAt(x, from) > 0)
        .map(x => `<option value="${x.id}">${esc(x.item)} (${remAt(x, from)} ${unit(x)} there)</option>`).join("");
      return opts
        ? `<div class="two d_row" style="margin-top:6px"><select class="d_i">${opts}</select>
             <input class="d_v" type="number" min="0" step="any" placeholder="Amount"></div>`
        : `<p class="d_row" style="color:var(--mu)">${esc(siteName(from))} has no usable stock.</p>`;
    }

    // Changing the sending site starts the goods list again
    function trRows() { $("d_rows").innerHTML = trRow(); }

    async function saveTransfer() {
      const from = +$("d1").value, to = +$("d2").value;
      const goods = [...document.querySelectorAll(".d_row")].filter(r => r.querySelector(".d_i"))
        .map(r => ({ item_id: +r.querySelector(".d_i").value, qty: num(+r.querySelector(".d_v").value || 0) }))
        .filter(g => g.qty > 0);

      if (from === to)                     return toast("Pick two different sites");
      if (!goods.length)                   return toast("Enter the amount of at least one item");
      if (new Set(goods.map(g => g.item_id)).size < goods.length) return toast("Each item can only be listed once");
      const over = goods.find(g => g.qty > remAt(I.find(x => x.id === g.item_id), from));
      if (over) { const x = I.find(i => i.id === over.item_id); return toast(`Only ${remAt(x, from)} ${unit(x)} ${x.item} at ${siteName(from)}`); }
      if (!$("d3").value.trim() || !$("d4").value.trim()) return toast("Enter the vehicle and the driver");

      if (busy) return;
      busy = true;
      let res;
      try {
        res = await sb.rpc("dispatch_transfer", { p_from: from, p_to: to, p_items: goods,
          p_vehicle: $("d3").value.trim(), p_driver: $("d4").value.trim(), p_note: $("d5").value.trim() || null });
      } catch (e) { res = { error: { message: "Can't reach the database. Check your internet connection" } }; }
      finally { busy = false; }
      if (res.error) return toast(errMsg(res.error));

      await load();
      go("Sites & Transfers");
      // Offer the waybill right away, it travels with the driver
      modal(`
        <h3>Dispatched · ${waybill(res.data)}</h3>
        <p>${goods.length} item(s) from <b>${esc(siteName(from))}</b> to <b>${esc(siteName(to))}</b> are now in transit.</p>
        <div class="note">Print the waybill for the driver. The receiving site signs it and presses <b>Receive</b> when the goods arrive.</div>
        <div class="actions">
          <button class="btn a" onclick="printWaybill(${res.data})">Print waybill</button>
          <button class="btn o" onclick="close_()">Done</button>
        </div>`);
    }

    // ----- Receive (proof of delivery) -----
    function receiveTr(id) {
      const t = TR.find(x => x.id === id);
      const rows = t.transfer_items.map(ti => {
        const x = I.find(i => i.id === ti.item_id);
        return `
          <tr>
            <td>${esc(x.item)}</td>
            <td>${+ti.qty_sent} ${unit(x)}</td>
            <td><input class="r_v" data-item="${ti.item_id}" data-sent="${+ti.qty_sent}" type="number" min="0"
                 max="${+ti.qty_sent}" step="any" value="${+ti.qty_sent}" style="width:110px" oninput="rcvCalc()"> ${unit(x)}</td>
          </tr>`;
      }).join("");

      modal(`
        <h3>Receive ${waybill(id)}</h3>
        <p style="color:var(--mu)">${esc(siteName(t.from_site))} → <b>${esc(siteName(t.to_site))}</b> · ${esc(t.vehicle)} · ${esc(t.driver)}</p>
        <p>Count what actually arrived. Lower the number for anything missing or damaged.</p>
        <table><tr><th>Item</th><th>Sent</th><th>Received</th></tr>${rows}</table>
        <label>Note (needed if something is short)</label>
        <input id="r_n" placeholder="e.g. 2 sacks torn and wet on arrival">
        <div class="note" id="r_sum"></div>
        <div class="actions">
          <button class="btn a" onclick="saveReceive(${id})">Confirm delivery</button>
          <button class="btn o" onclick="close_()">Cancel</button>
        </div>`);
      rcvCalc();
    }

    function rcvCalc() {
      const short = [...document.querySelectorAll(".r_v")].filter(i => +i.value < +i.dataset.sent);
      $("r_sum").innerHTML = short.length
        ? `<span style="color:var(--p1)">Short: ${short.map(i => {
            const x = I.find(it => it.id === +i.dataset.item);
            return `${num(i.dataset.sent - i.value)} ${unit(x)} ${esc(x.item)}`;
          }).join(", ")}. It will be logged as lost in Stock Movements.</span>`
        : "Everything arrived as sent.";
    }

    async function saveReceive(id) {
      const got = [...document.querySelectorAll(".r_v")].map(i => ({ item_id: +i.dataset.item, qty: num(+i.value), sent: +i.dataset.sent }));
      if (got.some(g => !(g.qty >= 0) || g.qty > g.sent)) return toast("Received must be between 0 and what was sent");
      const short = got.some(g => g.qty < g.sent);
      const note = $("r_n").value.trim();
      if (short && !note) return toast("Explain the shortage in the note");

      const ok = await act(sb.rpc("receive_transfer", { p_id: id, p_received: got.map(({ item_id, qty }) => ({ item_id, qty })), p_note: note || null }),
        short ? `${waybill(id)} received · shortage logged` : `${waybill(id)} received in full`);
      if (!ok) return;
      close_();
      go("Sites & Transfers");
    }

    async function cancelTr(id) {
      if (!confirm(`Cancel ${waybill(id)}? Use this only if the truck never left. The goods go back to the sending site.`)) return;
      if (await act(sb.rpc("cancel_transfer", { p_id: id }), `${waybill(id)} cancelled · goods returned`)) go("Sites & Transfers");
    }

    // ----- Printable waybill -----
    function printWaybill(id) {
      const t = TR.find(x => x.id === id);
      if (!t) return toast("Waybill not found");
      const from = SITES.find(s => s.id === t.from_site) || {}, to = SITES.find(s => s.id === t.to_site) || {};
      const rows = t.transfer_items.map(ti => {
        const x = I.find(i => i.id === ti.item_id) || { item: "—", measure: "count" };
        return `<tr><td>${esc(x.item)}</td><td>${+ti.qty_sent} ${unit(x)}</td>
          <td>${ti.qty_received != null ? +ti.qty_received + " " + unit(x) : ""}</td></tr>`;
      }).join("");

      const w = window.open("", "_blank");
      if (!w) return toast("Allow pop-ups for this page to print the waybill");
      w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${waybill(id)}</title>
        <style>
          body { font: 14px/1.5 system-ui, sans-serif; color: #111; margin: 32px; }
          h1 { margin: 0; font-size: 24px; } .no { font: 700 22px ui-monospace, Consolas, monospace; }
          table { width: 100%; border-collapse: collapse; margin: 16px 0; }
          th, td { border: 1px solid #999; padding: 8px; text-align: left; }
          .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; margin-top: 16px; }
          .sign { border-top: 1px solid #111; padding-top: 4px; margin-top: 48px; }
        </style></head><body>
        <div style="display:flex;justify-content:space-between;align-items:flex-end">
          <div><h1>ReliefSys Waybill</h1>Relief goods transfer</div>
          <div class="no">${waybill(id)}</div>
        </div>
        <div class="grid">
          <div><b>From:</b> ${esc(from.name)}<br>${esc(from.kind)} · ${esc(from.brgy || "")}</div>
          <div><b>To:</b> ${esc(to.name)}<br>${esc(to.kind)} · ${esc(to.brgy || "")}</div>
          <div><b>Vehicle:</b> ${esc(t.vehicle)}<br><b>Driver:</b> ${esc(t.driver)}</div>
          <div><b>Dispatched:</b> ${new Date(t.sent_at).toLocaleString()}<br><b>By:</b> ${esc(uname(t.sent_by))}
            <br><b>Status:</b> ${t.status}</div>
        </div>
        ${t.note ? `<p><b>Note:</b> ${esc(t.note)}</p>` : ""}
        <table><tr><th>Item</th><th>Quantity sent</th><th>Quantity received</th></tr>${rows}</table>
        ${t.receive_note ? `<p><b>Receiving note:</b> ${esc(t.receive_note)}</p>` : ""}
        <div class="grid">
          <div class="sign">Released by (name &amp; signature)</div>
          <div class="sign">Received by (name &amp; signature) · date</div>
          <div class="sign">Driver (name &amp; signature)</div>
        </div>
        <script>window.onload = () => window.print();<\/script>
        </body></html>`);
      w.document.close();
    }

    // ----- Sponsors & donations -----
    function addSp() {
      modal(`
        <h3>Add sponsor / donor</h3>
        <label>Name</label>
        <input id="f1">
        <label>Type</label>
        <select id="f2">
          <option>Individual</option>
          <option>Organization</option>
          <option>Company</option>
        </select>
        <label>Contact</label>
        <input id="f3">

        <div class="actions">
          <button class="btn a" onclick="saveSp()">Save</button>
          <button class="btn o" onclick="close_()">Cancel</button>
        </div>`);
    }

    async function saveSp() {
      const ok = await act(sb.from("sponsors").insert({
        name: $("f1").value.trim() || "Unnamed", type: $("f2").value, contact: $("f3").value.trim()
      }), "Sponsor saved");
      if (!ok) return;

      close_();
      go("Sponsors & Donations");
    }

    function addDon() {
      if (!S.length) return toast("Add a sponsor first");
      if (!I.length) return toast("Add a relief item first");
      const sponsors = S.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
      const items = I.map((x, i) => `<option value="${i}">${esc(x.item)} (${unit(x)})</option>`).join("");

      modal(`
        <h3>Record donation</h3>
        <label>Sponsor</label>
        <select id="f1">${sponsors}</select>
        <label>Item</label>
        <select id="f2" onchange="donForm()">${items}</select>
        <label>Received as</label>
        <select id="f6" onchange="donForm()">
          <option value="bulk">Bulk / loose (e.g. 1000 L in a tank, 300 kg in sacks)</option>
          <option value="pack">Packs, bottles or boxes (e.g. 100 bottles × 500 mL)</option>
        </select>
        <label id="fql">Amount</label>
        <input id="f3" type="number" value="50" min="0" step="any" oninput="donCalc()">
        <div id="fps">
          <label>Size of each pack</label>
          <input id="f7" type="number" value="1" min="0" step="any" oninput="donCalc()">
        </div>
        <label>Unit</label>
        <select id="f8" onchange="donCalc()"></select>
        <div id="fex">
          <label>Expiry date</label>
          <input id="f9" type="date">
        </div>
        <div class="note" id="fcv"></div>

        <div class="actions">
          <button class="btn a" onclick="saveDon()">Save donation</button>
          <button class="btn o" onclick="close_()">Cancel</button>
        </div>`);
      donForm();
    }

    // Shows only the units and fields that fit the chosen item
    function donForm() {
      const x = I[$("f2").value];
      const pack = $("f6").value === "pack";
      $("f8").innerHTML = Object.keys(MEASURES[x.measure].units).map(u => `<option>${u}</option>`).join("");
      $("fql").textContent = pack ? "Number of packs" : "Amount";
      $("fps").style.display = pack ? "" : "none";
      $("fex").style.display = x.perish ? "" : "none";
      $("f9").min = today();
      donCalc();
    }

    // Converts what was received into the item's base unit
    function donCalc() {
      const x = I[$("f2").value];
      const pack = $("f6").value === "pack";
      const n = +$("f3").value, size = pack ? +$("f7").value : 1, u = $("f8").value;
      const total = num(n * size * MEASURES[x.measure].units[u]);
      const got = pack ? `${num(n)} × ${num(size)} ${u} packs` : `${num(n)} ${u} (bulk)`;

      $("fcv").innerHTML = total > 0
        ? `${esc(got)} = <b>${total} ${unit(x)}</b> added to ${esc(x.item)} · ` + (x.give
          ? `enough for ${Math.floor(total / x.per)} ${x.basis === "person" ? "people" : "families"} at ${x.per} ${unit(x)} per ${whom(x)}`
          : "kept in storage until it is sorted")
        : "Enter an amount above 0";
      return { total, got };
    }

    async function saveDon() {
      const x = I[$("f2").value];
      const { total, got } = donCalc();
      const exp = x.perish ? $("f9").value : "";

      if (!(total > 0)) return toast("Enter an amount above 0");
      if (x.perish && !exp) return toast("Perishable item · enter the expiry date");
      if (exp && exp < today()) return toast("That stock is already expired · do not accept it");

      // Adds the stock batch and the donation record together
      const ok = await act(sb.rpc("record_donation", {
        p_sponsor: +$("f1").value, p_item: x.id, p_received_as: got, p_qty: total, p_exp: exp || null
      }), `Donation recorded · +${total} ${unit(x)} ${x.item}`);
      if (!ok) return;

      close_();
      go("Sponsors & Donations");
    }

    // ----- Reports -----
    function rep(type) {
      const reports = {
        Beneficiary:  () => B.map(b => `${b.name} — ${cats(b).join(" + ")}, ${INC[b.inc]}, ${b.ver ? "ID verified" : "ID pending"}`),
        Sponsor:      () => S.map(s => `${s.name} — ${s.type}`),
        Inventory:    () => I.map(x => {
          const u = unit(x);
          return `[${x.cat}] ${x.item}: donated ${x.don} ${u}, distributed ${x.dist} ${u}, remaining ${rem(x)} ${u}` +
            ` (${x.give ? `${x.per} ${u} per ${whom(x)}, ` : ""}${reach(x)})` + (nextExp(x) ? `, next expiry ${nextExp(x)}` : "") +
            (spoiled(x) ? `, ${spoiled(x)} ${u} expired` : "");
        }),
        Donation:     () => DON.map(d => {
          const x = I.find(i => i.item === d.item);
          return `${d.date} ${d.sp}: ${d.got} ${d.item} → ${d.q} ${x ? unit(x) : ""}` + (d.exp ? `, expires ${d.exp}` : "");
        }),
        Distribution: () => D.map(d => `${d.date} ${d.ben}: ${d.items}`),
        "Stock movement": () => M.map(m =>
          `${m.date} ${m.item} @ ${m.site}: ${m.q > 0 ? "+" : ""}${m.q} ${m.unit} · ${MOVES[m.kind] || m.kind} · ${m.reason} (${m.by})`)
      };
      const lines = reports[type]();

      const el = $("rp");
      el.style.display = "block";
      el.className = "card in";
      el.innerHTML = `
        <b>${type} report</b>
        <button class="btn s" style="float:right" onclick="window.print()">Print / Save PDF</button>
        <ul>${lines.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    }


    /* =========================================================
       START
       ========================================================= */
    // Stay logged in after a page refresh if the browser still has a session
    showLogin();
    // A saved session that sat unused longer than the idle limit is ended instead of reused
    sb.auth.getSession().then(async ({ data }) => {
      if (!data.session) return;
      if (lastActive() && Date.now() - lastActive() > IDLE_MIN * 60000) {
        await sb.auth.signOut();
        $("err").textContent = `You were logged out after ${IDLE_MIN} minutes of inactivity.`;
        return;
      }
      enter();
    });
  </script>
</body>
</html>
