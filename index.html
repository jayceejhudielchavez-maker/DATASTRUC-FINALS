      const max = Math.max(1, ...rows.map(r => r.v));
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${what} by group">` + rows.map((r, i) => {
        const w = r.v / max * (W - L - R), y = i * rowH + 8;
        return `<g class="col" data-tip="${esc(r.label)}: ${r.v} ${what}">
          <rect class="hit" x="0" y="${i * rowH}" width="${W}" height="${rowH}"/>
          <text class="lbl" x="0" y="${y + 13}">${esc(r.label)}</text>
          ${w > 0 ? `<path d="${hBar(L, y, w, 18)}" style="fill:${r.color}"/>` : ""}
          <text class="lbl" x="${L + w + 6}" y="${y + 13}">${r.v}</text>
        </g>`;
      }).join("") + `<line class="base" x1="${L}" x2="${L}" y1="0" y2="${H}"/></svg>`;
    }

    function dashCharts() {
      const days = Array.from({ length: 14 }, (_, i) => plusDays(today(), i - 13));
      const md = d => new Date(d + "T00:00").toLocaleDateString("en-PH", { month: "short", day: "numeric" });
      const perDay = list => days.map(d => ({ label: String(+d.slice(8)), tip: md(d), v: list.filter(x => x.date === d).length }));

      const served = perDay(D), total = served.reduce((s, r) => s + r.v, 0);
      const first = `
        <div class="card chart">
          <b>Families served per day</b> <span style="color:var(--mu)">· last 14 days · ${total} in all</span>
          ${columnChart(served, total === 1 ? "family" : "families")}
          ${tableView(["Date", "Families served"], served.map(r => [r.tip, r.v]))}
        </div>`;

      // Who got relief, by priority group: shows the queue is working (beneficiary roles only)
      let second;
      if (people()) {
        const recent = D.filter(d => d.date >= days[0]).map(d => B.find(b => b.id === d.bid)).filter(Boolean);
        const groups = [1, 2, 3].map(t => ({ label: PL[t], v: recent.filter(b => tier(b) === t).length, color: `var(--p${t})` }));
        second = `
          <div class="card chart">
            <b>Served by priority group</b> <span style="color:var(--mu)">· last 14 days</span>
            ${hbarChart(groups, "families")}
            ${tableView(["Priority", "Families served"], groups.map(g => [g.label, g.v]))}
          </div>`;
      } else {
        const dons = perDay(DON), n = dons.reduce((s, r) => s + r.v, 0);
        second = `
          <div class="card chart">
            <b>Donations recorded per day</b> <span style="color:var(--mu)">· last 14 days · ${n} in all</span>
            ${columnChart(dons, n === 1 ? "donation" : "donations")}
            ${tableView(["Date", "Donations"], dons.map(r => [r.tip, r.v]))}
          </div>`;
      }
      return `<div class="charts" style="margin-bottom:12px">${first}${second}</div>`;
    }

    // Hover tooltip for anything with data-tip (chart bars)
    addEventListener("pointermove", e => {
      const t = e.target.closest && e.target.closest("[data-tip]"), tip = $("tip");
      if (!t) return (tip.style.display = "none");
      tip.textContent = t.dataset.tip;
      tip.style.display = "block";
      tip.style.left = Math.max(8, Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8)) + "px";
      tip.style.top = Math.max(8, e.clientY - tip.offsetHeight - 10) + "px";
    });

    // ----- QR claim cards -----
    // Each family's card carries a random code (not their record number), so a card can't be faked by guessing.
    // Scanning it finds the family; the queue rules and the waiting period still apply.
    const CLAIM = "RELIEFSYS:";
    const fmtCode = c => (c.match(/.{1,4}/g) || []).join("-");

    function qrSvg(text) {
      const q = qrcode(0, "M");
      q.addData(text);
      q.make();
      return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    }

    function printCards(ids) {
      if (typeof qrcode === "undefined") return toast("The QR maker couldn't load. Check your internet connection");
      const list = ids.map(id => B.find(b => b.id === id)).filter(b => b && b.ver && b.code);
      if (!list.length) return toast("No verified families to print cards for. Run 08_claims_live_map.sql if codes are missing");

      const cards = list.map(b => `
        <div class="card">
          <div class="hd"><b>ReliefSys</b> · Relief claim card</div>
          <div class="row">
            <div class="qr">${qrSvg(CLAIM + b.code)}</div>
            <div>
              <div class="nm">${esc(b.name)}</div>
              <div>${esc(b.brgy)}</div>
              <div>Family of ${b.fam}</div>
              ${b.site ? `<div>Claim at: <b>${esc(siteName(b.site))}</b></div>` : ""}
              <div class="cd">${fmtCode(b.code)}</div>
            </div>
          </div>
          <div class="ft">Show this card with a valid ID. Relief is free: never pay for it, and never sell or lend this card.
            Lost it? Ask the barangay for a new one.</div>
        </div>`).join("");

      const w = window.open("", "_blank");
      if (!w) return toast("Allow pop-ups for this page to print the cards");
      w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Claim cards</title>
        <style>
          body { font: 12px/1.4 system-ui, sans-serif; color: #111; margin: 16px; }
          .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
          .card { border: 1.5px dashed #555; border-radius: 10px; padding: 10px 12px; break-inside: avoid; }
          .hd { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #444; margin-bottom: 6px; }
          .row { display: flex; gap: 12px; align-items: center; }
          .qr svg { width: 110px; height: 110px; display: block; }
          .nm { font-size: 16px; font-weight: 700; }
          .cd { font: 700 14px ui-monospace, Consolas, monospace; letter-spacing: 1px; margin-top: 6px; }
          .ft { font-size: 10px; color: #444; margin-top: 8px; }
          @media print { body { margin: 0; } }
        </style></head><body>
        <div class="grid">${cards}</div>
        <script>window.onload = () => window.print();<\/script>
        </body></html>`);
      w.document.close();
    }

    async function reissue(id) {
      const b = B.find(x => x.id === id);
      if (!confirm(`Make a new claim code for ${b.name}?\n\nTheir old card stops working. Only do this if the card was lost or stolen.`)) return;
      if (!(await act(sb.rpc("reissue_claim_code", { ben_id: id }), "New code made · the old card no longer works"))) return;
      go("Beneficiaries");
      modal(`
        <h3>New claim card · ${esc(b.name)}</h3>
        <p>The old card no longer works. Print the new one and give it to the family.</p>
        <div class="actions">
          <button class="btn a" onclick="printCards([${id}]); close_()">Print new card</button>
          <button class="btn o" onclick="close_()">Later</button>
        </div>`);
    }

    // Scan (or type) a claim card at the distribution table
    function scanClaim() {
      modal(`
        <h3>Scan claim card</h3>
        <p style="color:var(--mu)">Point the camera at the QR on the family's card. Check their valid ID too.</p>
        <div id="qrv" style="display:none;border-radius:8px;overflow:hidden"></div>
        <div class="chips">
          <button class="btn s" onclick="startCam(claimFound, claimErr)">Scan with camera</button>
          <label class="btn o s" style="display:inline-block;margin:0;font-size:12px;color:var(--tx)">
            Upload QR photo
            <input type="file" accept="image/*" hidden onchange="this.files[0]&&scanFile(this.files[0], claimFound, claimErr);this.value=''">
          </label>
        </div>
        <label>Or type the code printed on the card</label>
        <div style="display:flex;gap:8px">
          <input id="cc" placeholder="e.g. 3F9A-1C0B-7D" style="text-transform:uppercase" onkeydown="if(event.key==='Enter')claimFound(this.value)">
          <button class="btn" onclick="claimFound($('cc').value)">Find</button>
        </div>
        <div class="err" id="cerr"></div>
        <div class="actions"><button class="btn o" onclick="close_()">Cancel</button></div>`);
      startCam(claimFound, claimErr);
    }

    const claimErr = m => { if ($("cerr")) $("cerr").textContent = m; };

    async function claimFound(text) {
      stopCam();
      const code = String(text).trim().toUpperCase().replace(CLAIM, "").replace(/[^A-Z0-9]/g, "");
      if (!code) return claimErr("Enter the code printed on the card.");
      // Only LGU and Admin have the codes on the page; everyone else asks the database which family it is
      let b = B.find(x => x.code && x.code === code);
      if (!b) {
        claimErr("Looking up the card…");
        const { data, error } = await sb.rpc("find_claim", { p_code: code });
        if (error) return claimErr(errMsg(error));
        b = data ? B.find(x => x.id === data) : null;
        claimErr("");
      }
      if (!b)           return claimErr("No family has this card. It may be an old card that was replaced, or not a ReliefSys card.");
      if (!b.ver)       return claimErr(`${b.name} isn't verified yet. An LGU or Admin must check their ID first.`);
      if (!canServe(b)) return claimErr(`${b.name} already received relief on ${niceDate(b.last)}. They can receive again from ${niceDate(nextServe(b))}.`);

      // The serve screen says who is ahead and asks for a reason (and approval) if they aren't first
      serve(b.id);
    }

    // ----- Map of sites -----
    // Pins are colored by how many families the site can fully serve with what it holds now
    const MAPS = {};   // live maps by element id: "map" (Sites & Transfers), "dmap" (dashboard snippet)
    let pickMap = null, pickPin = null;
    // Esri basemaps: free without an API key (OpenStreetMap's servers refuse pages opened from a file,
    // and CARTO now asks for a key). Street map in light mode; dark gray map + labels in dark mode.
    const isDark = () => document.documentElement.dataset.theme === "dark"
      || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
    const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
    const ESRI_CREDIT = 'Tiles © <a href="https://www.esri.com">Esri</a> · Esri, HERE, Garmin, © OpenStreetMap contributors, GIS user community';
    function addTiles(m) {
      const layers = isDark()
        ? ["Canvas/World_Dark_Gray_Base", "Canvas/World_Dark_Gray_Reference"]   // map, then place names on top
        : ["World_Street_Map"];
      layers.forEach((l, i) => L.tileLayer(`${ESRI}${l}/MapServer/tile/{z}/{y}/{x}`,
        { maxZoom: isDark() ? 16 : 19, attribution: i ? "" : ESRI_CREDIT }).addTo(m));
    }
    const PH = [12.88, 121.77];   // whole Philippines, until sites have locations

    function siteFamilies(s) {
      const fam = given().filter(x => x.basis === "family"), use = fam.length ? fam : given();
      return use.length ? Math.min(...use.map(x => Math.floor(remAt(x, s.id) / share(x, 1)))) : 0;
    }

    // ----- Where to send goods -----
    // Ranks the sites that need goods. Only a suggestion: a person still checks roads and other agencies, then dispatches.
    //   shortage = families waiting − families the site can serve (its stock + trucks already on the way)
    //   score    = area status weight × (shortage + high-priority families waiting)
    // High-priority families count twice on purpose, so the most vulnerable push a site up the list.
    const STATUS_WEIGHT = { "Normal": 1, "Signal 1": 1, "Signal 2": 1.5, "Signal 3": 1.5,
                            "Signal 4": 2, "Signal 5": 2, "State of Calamity": 3 };
    const FAM_SIZE = 4;   // people per family assumed when suggesting per-person items (PH average is about 4)
    const areaOf = s => AREAS.find(a => a.id === s.area_id) || null;
    const statusOf = s => (areaOf(s) || {}).status || "Normal";
    const statusTag = st => `<span class="tag ${st === "State of Calamity" ? "t1" : /^Signal/.test(st) ? "t2" : "t0"}">${st}</span>`;

    // Amount of an item on trucks heading to a site
    const incoming = (x, siteId) => num(TR.filter(t => t.status === "In transit" && t.to_site === siteId)
      .flatMap(t => t.transfer_items).filter(ti => ti.item_id === x.id).reduce((s, ti) => s + +ti.qty_sent, 0));

    // Families a site can fully serve with what it holds, optionally counting what is on the way
    function coverAt(s, withTrucks) {
      const fam = given().filter(x => x.basis === "family"), use = fam.length ? fam : given();
      return use.length ? Math.min(...use.map(x =>
        Math.floor((remAt(x, s.id) + (withTrucks ? incoming(x, s.id) : 0)) / share(x, 1)))) : 0;
    }

    function needRows() {
      return SITES.filter(s => s.kind !== "Warehouse").map(s => {
        const n = NEED.find(r => r.site_id === s.id) || { waiting: 0, high: 0, registered: 0 };
        const status = statusOf(s), w = STATUS_WEIGHT[status] || 1;
        const now = coverAt(s, false), withTrucks = coverAt(s, true);
        const shortage = Math.max(0, n.waiting - withTrucks);
        const prep = Math.max(0, n.registered - withTrucks);   // before a storm: enough for everyone registered there
        return {
          s, area: areaOf(s), status, w, waiting: n.waiting, high: n.high, registered: n.registered,
          now, onWay: withTrucks - now, shortage, prep,
          score: shortage ? w * (shortage + n.high) : 0,
          prepScore: /^Signal/.test(status) ? w * prep : 0
        };
      });
    }

    function whereToSend() {
      const rows = needRows();
      const relief = rows.filter(r => r.score > 0).sort((a, b) => b.score - a.score);
      const prep = rows.filter(r => r.prepScore > 0 && !r.score).sort((a, b) => b.prepScore - a.prepScore);
      const line = (r, i, prepping) => `
        <div class="q" style="animation:none">
          <div class="n">${i + 1}</div>
          <div class="g">
            <b>${esc(r.s.name)}</b> · ${r.area ? esc(r.area.name) : `<span style="color:var(--mu)">no area set</span>`} ${statusTag(r.status)}<br>
            <span style="color:var(--mu)">${prepping
              ? `Stock for ${r.now + r.onWay} of ${r.registered} registered families${r.onWay ? ` (${r.onWay} on the way)` : ""} · storm expected`
              : `${r.shortage} ${r.shortage === 1 ? "family" : "families"} short · ${r.high} high priority waiting · `
                + (r.onWay ? `${r.onWay} covered by trucks on the way` : "no truck on the way")}
              · score ${num(prepping ? r.prepScore : r.score)}</span>
          </div>
          ${logi() ? `<button class="btn ${prepping ? "o" : "a"} s" onclick="sendTo(${r.s.id}, ${prepping ? r.prep : r.shortage})">
            ${prepping ? "Pre-position" : "Dispatch"}</button>` : ""}
        </div>`;

      return `
        <div class="card" data-tour="where">
          <b>Where to send goods</b>
          <span style="color:var(--mu)">· area status × (families short + high-priority families)</span>
          ${relief.length ? `<p style="margin:12px 0 6px"><b>Send relief now</b></p>${relief.map((r, i) => line(r, i)).join("")}`
            : `<p style="color:var(--mu);margin:10px 0 0">No site is short of goods right now.</p>`}
          ${prep.length ? `<p style="margin:14px 0 6px"><b>Pre-position</b>
              <span style="color:var(--mu)">· a storm signal is raised: prepare before it hits, don't distribute yet</span></p>
            ${prep.map((r, i) => line(r, i, true)).join("")}` : ""}
          <div class="note">A suggestion from the numbers in the system. Check road access and what other agencies are
            already sending before dispatching.${SITES.some(s => s.kind !== "Warehouse" && !s.area_id)
              ? " Some sites have no area yet: set it in <b>Sites &amp; Transfers</b>." : ""}</div>
        </div>`;
    }

    // Logistics: open Dispatch pre-filled for a site that needs goods for `families` families.
    // Sends from the site holding the most stock, up to what it has.
    function sendTo(siteId, families) {
      const from = SITES.filter(s => s.id !== siteId)
        .sort((a, b) => coverAt(b, false) - coverAt(a, false) || (b.kind === "Warehouse") - (a.kind === "Warehouse"))[0];
      if (!from) return toast("Add another site to send from");
      const plan = given().map(x => ({ item_id: x.id, qty: num(Math.min(remAt(x, from.id), share(x, FAM_SIZE) * families)) }))
        .filter(p => p.qty > 0);
      addTransfer(siteId, from.id, plan, families);
    }

    // ----- Trucks on the way (estimated position, no GPS) -----
    // How far along the line from sender to receiver the truck should be by now,
    // worked out from the dispatch time, the distance and an average speed.
    const AVG_KMH = 30;        // typical relief truck on town and provincial roads, short stops included
    const ROAD_FACTOR = 1.3;   // roads are longer than a straight line

    function km(a, b) {        // straight-line distance between two [lat, lng] points
      const R = 6371, rad = Math.PI / 180, dLa = (b[0] - a[0]) * rad, dLo = (b[1] - a[1]) * rad;
      const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLo / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }
    const siteLL = id => { const s = SITES.find(x => x.id === id); return s && s.lat != null && s.lng != null ? [+s.lat, +s.lng] : null; };

    // null when either site isn't on the map yet
    function trip(t) {
      const a = siteLL(t.from_site), b = siteLL(t.to_site);
      if (!a || !b) return null;
      const mins = Math.max(5, km(a, b) * ROAD_FACTOR / AVG_KMH * 60);
      const start = new Date(t.sent_at).getTime(), eta = start + mins * 60000;
      const f = Math.min(1, Math.max(0, (Date.now() - start) / (eta - start)));
      return { a, b, eta, f, late: Date.now() > eta, pos: [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f] };
    }

    const clock = ms => new Date(ms).toLocaleTimeString("en-PH", { hour: "numeric", minute: "2-digit" });
    const etaText = p => p.late
      ? `Due ${clock(p.eta)} · overdue by ${Math.round((Date.now() - p.eta) / 60000)} min`
      : `ETA ~${clock(p.eta)} · ${Math.round(p.f * 100)}% of the way`;

    function truckIcon(t, p, mini) {
      return L.divIcon({ className: "truck" + (p.late ? " late" : ""), iconSize: [30, 30], iconAnchor: [15, 15],
        html: `<span>🚚</span>${mini ? "" : `<b>${waybill(t.id)}</b>`}` });
    }

    function truckPopup(t) {
      const p = trip(t);
      return `<b>🚚 ${waybill(t.id)}</b><br>
        ${esc(siteName(t.from_site))} → ${esc(siteName(t.to_site))}<br>
        ${esc(t.vehicle)} · ${esc(t.driver)}<br>
        Left ${clock(new Date(t.sent_at).getTime())}<br>
        <b>${p ? etaText(p) : ""}</b><br>
        <span style="opacity:.7">Estimated position, not GPS. ${p && p.late ? "Call the driver, or Receive it if it has arrived." : ""}</span>`;
    }

    // Every few seconds, without redrawing the page: move the trucks, and refresh the ETA text
    // in the Transfers table and in any truck popup that is open
    setInterval(() => {
      Object.values(MAPS).forEach(m => (m._trucks || []).forEach(x => {
        const p = trip(x.t);
        if (!p) return;
        x.m.setLatLng(p.pos);
        x.done.setLatLngs([p.a, p.pos]);
        x.left.setLatLngs([p.pos, p.b]);
        if (p.late !== x.late) { x.late = p.late; x.m.setIcon(truckIcon(x.t, p, x.mini)); }
        if (x.m.isPopupOpen()) x.m.setPopupContent(() => truckPopup(x.t));   // a function, so reopening is fresh too
      }));

      document.querySelectorAll(".eta[data-tr]").forEach(e => {
        const t = TR.find(x => x.id === +e.dataset.tr), p = t && trip(t);
        if (!p) return;
        e.textContent = etaText(p);
        e.style.color = p.late ? "var(--s-crit)" : "var(--mu)";
      });
    }, 3000);

    // id = "map" for the full map, "dmap" for the dashboard snippet
    function drawMap(id = "map") {
      const el = $(id), mini = id === "dmap";
      if (!el) return;
      if (typeof L === "undefined") {
        el.innerHTML = `<p style="padding:12px;color:var(--mu)">The map couldn't load. Check your internet connection.</p>`;
        return;
      }
      // Keep the view when redrawing after a live update
      const old = MAPS[id];
      const keep = old && $("view").classList.contains("quiet") ? { c: old.getCenter(), z: old.getZoom() } : null;
      if (old) old.remove();
      const siteMap = MAPS[id] = L.map(el, { scrollWheelZoom: false, maxZoom: isDark() ? 16 : 19 });
      addTiles(siteMap);

      const css = getComputedStyle(document.documentElement), col = v => css.getPropertyValue(v).trim();
      const pins = SITES.filter(s => s.lat != null && s.lng != null).map(s => {
        const f = siteFamilies(s);
        const [color, label] = f === 0 ? ["--s-crit", "Out of stock"] : f < 20 ? ["--s-low", "Running low"] : ["--s-ok", "Stocked"];
        const coming = TR.filter(t => t.status === "In transit" && t.to_site === s.id).length;
        L.circleMarker([+s.lat, +s.lng], {
          radius: s.kind === "Warehouse" ? 12 : 9, color: col("--card"), weight: 2, fillColor: col(color), fillOpacity: 1
        }).addTo(siteMap).bindPopup(`
          <b>${esc(s.name)}</b><br>${s.kind}${s.brgy ? " · " + esc(s.brgy) : ""}<br>
          ${areaOf(s) ? `${esc(areaOf(s).name)} · <b>${areaOf(s).status}</b><br>` : ""}
          <b>${label}</b> · can serve ${f} ${f === 1 ? "family" : "families"}
          ${coming ? `<br>${coming} truck${coming > 1 ? "s" : ""} on the way` : ""}
          ${mini ? `<br><a href="#" onclick="go('Sites & Transfers'); return false">Open Sites &amp; Transfers</a>`
            : logi() ? `<br><a href="#" onclick="setLoc(${s.id}); return false">Move pin</a>` : ""}`);
        return [+s.lat, +s.lng];
      });

      // Trucks on the way: the part already driven is solid, the rest is dashed
      const ink = col("--p2");
      siteMap._trucks = TR.filter(t => t.status === "In transit").map(t => ({ t, p: trip(t) })).filter(x => x.p).map(({ t, p }) => ({
        t, mini, late: p.late,
        done: L.polyline([p.a, p.pos], { color: ink, weight: 3 }).addTo(siteMap),
        left: L.polyline([p.pos, p.b], { color: ink, weight: 3, dashArray: "6 8", opacity: .8 }).addTo(siteMap),
        m: L.marker(p.pos, { icon: truckIcon(t, p, mini), zIndexOffset: 1000 }).addTo(siteMap).bindPopup(() => truckPopup(t))
      }));

      if (keep) siteMap.setView(keep.c, keep.z);
      else if (pins.length > 1) siteMap.fitBounds(pins, { padding: [30, 30], maxZoom: 15 });
      else if (pins.length) siteMap.setView(pins[0], 14);
      else siteMap.setView(PH, 5);
    }

    // Admin / Logistics: place a site on the map
    function setLoc(id) {
      const s = SITES.find(x => x.id === id);
      if (typeof L === "undefined") return toast("The map couldn't load. Check your internet connection");
      modal(`
        <h3>Location · ${esc(s.name)}</h3>
        <p style="color:var(--mu)">Click the map where the site is, or use your current location if you're there now.</p>
        <div id="pmap" class="map small"></div>
        <div class="two">
          <div><label>Latitude</label><input id="la" type="number" step="any" value="${s.lat ?? ""}" oninput="movePick()"></div>
          <div><label>Longitude</label><input id="lo" type="number" step="any" value="${s.lng ?? ""}" oninput="movePick()"></div>
        </div>
        <div class="actions">
          <button class="btn a" onclick="saveLoc(${id})">Save location</button>
          <button class="btn o" onclick="hereLoc()">Use my current location</button>
          <button class="btn o" onclick="close_()">Cancel</button>
        </div>`);

      if (pickMap) pickMap.remove();
      pickMap = L.map("pmap", { maxZoom: isDark() ? 16 : 19 });
      addTiles(pickMap);
      const other = SITES.find(x => x.id !== id && x.lat != null);
      const start = s.lat != null ? [+s.lat, +s.lng] : other ? [+other.lat, +other.lng] : PH;
      pickMap.setView(start, s.lat != null || other ? 15 : 5);
      pickMap.on("click", e => {
        $("la").value = e.latlng.lat.toFixed(6);
        $("lo").value = e.latlng.lng.toFixed(6);
        movePick();
      });
      setTimeout(() => pickMap && pickMap.invalidateSize(), 300);   // the form pops in, so measure again
      movePick();
    }

    function movePick() {
      const la = parseFloat($("la").value), lo = parseFloat($("lo").value);
      if (pickPin) { pickPin.remove(); pickPin = null; }
      if (isNaN(la) || isNaN(lo)) return;
      const css = getComputedStyle(document.documentElement);
      pickPin = L.circleMarker([la, lo], { radius: 10, color: css.getPropertyValue("--card").trim(), weight: 2,
        fillColor: css.getPropertyValue("--chart").trim(), fillOpacity: 1 }).addTo(pickMap);
    }

    function hereLoc() {
      if (!navigator.geolocation) return toast("This device can't share its location");
      navigator.geolocation.getCurrentPosition(p => {
        $("la").value = p.coords.latitude.toFixed(6);
        $("lo").value = p.coords.longitude.toFixed(6);
        movePick();
        pickMap.setView([p.coords.latitude, p.coords.longitude], 17);
      }, () => toast("Couldn't get your location. Allow location access, or click the map instead"));
    }

    async function saveLoc(id) {
      const lat = parseFloat($("la").value), lng = parseFloat($("lo").value);
      if (isNaN(lat) || isNaN(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return toast("Click the map to place the pin first");
      if (await act(sb.from("sites").update({ lat: +lat.toFixed(6), lng: +lng.toFixed(6) }).eq("id", id), "Location saved")) {
        close_();
        go("Sites & Transfers");
      }
    }

    // ----- Reports -----
    function rep(type) {
      const reports = {
        Beneficiary:  () => B.map(b => `${b.name} — ${cats(b).join(" + ")}, ${INC[b.inc]}, ${b.ver ? "ID verified" : "ID pending"}`),
        Sponsor:      () => S.map(s => `${s.name} — ${s.type}`),
        Inventory:    () => I.map(x => {
          const u = unit(x);
          return `[${x.cat}] ${x.item}: donated ${x.don} ${u}, distributed ${x.dist} ${u}, remaining ${rem(x)} ${u}` +
            ` (${x.give ? `${x.per} ${u} per ${whom(x)}, ` : ""}${reach(x)})` + (nextExp(x) ? `, next expiry ${nextExp(x)}` : "") +
            (spoiled(x) ? `, ${spoiled(x)} ${u} expired` : "");
        }),
        Donation:     () => DON.map(d => {
          const x = I.find(i => i.item === d.item);
          return `${d.date} ${d.sp}: ${d.got} ${d.item} → ${d.q} ${x ? unit(x) : ""}` + (d.exp ? `, expires ${d.exp}` : "");
        }),
        Distribution: () => D.map(d => `${d.date} ${d.ben}: ${d.items}`),
        "Stock movement": () => M.map(m =>
          `${m.date} ${m.item} @ ${m.site}: ${m.q > 0 ? "+" : ""}${m.q} ${m.unit} · ${MOVES[m.kind] || m.kind} · ${m.reason} (${m.by})`)
      };
      const lines = reports[type]();

      const el = $("rp");
      el.style.display = "block";
      el.className = "card in";
      el.innerHTML = `
        <button class="btn s" style="float:right" onclick="window.print()">Print / Save PDF</button>
        <h3>ReliefSys · ${type} report</h3>
        <p style="color:var(--mu);margin:4px 0 0">Generated ${new Date().toLocaleString("en-PH", { timeZone: "Asia/Manila" })}
          by ${esc(user)} (${esc(role)}) · ${lines.length} ${lines.length === 1 ? "entry" : "entries"}</p>
        <ul>${lines.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    }


    /* =========================================================
       START
       ========================================================= */
    // Stay logged in after a page refresh if the browser still has a session
    showLogin();
    // A saved session that sat unused longer than the idle limit is ended instead of reused
    sb.auth.getSession().then(async ({ data }) => {
      if (!data.session) return;
      if (lastActive() && Date.now() - lastActive() > IDLE_MIN * 60000) {
        await sb.auth.signOut();
        $("err").textContent = `You were logged out after ${IDLE_MIN} minutes of inactivity.`;
        return;
      }
      enter();
    });
  </script>
</body>
</html>
