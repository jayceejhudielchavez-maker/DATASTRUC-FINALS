<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ReliefSys – Smart Disaster Relief Distribution System</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
  <!-- Map of sites (Leaflet + OpenStreetMap) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script>
    // Apply the saved light/dark choice before the page draws, so it never flashes the wrong colors
    try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>

  <style>
    /* ===================== Theme colors ===================== */
    :root {
      --bg: #eff3f0;      /* page background */
      --card: #fff;       /* card background */
      --tx: #0e1510;      /* text */
      --mu: #5b6b60;      /* muted text */
      --bd: #d6e0d9;      /* borders */
      --pr: #0b0f0c;      /* primary (black) */
      --prt: #fff;        /* text on primary */
      --ac: #86efac;      /* accent (light mint green) */
      --act: #052e16;     /* text on accent */
      --glow: 0 0 0 1px #86efac66, 0 0 22px #86efacaa;   /* soft bloom around accent things */
      --sb: #fff;         /* sidebar menu background */
      --sbt: #0e1510;     /* sidebar text */
      --sbh: #0e15100f;   /* sidebar link hover */
      --s-ok: #33db20;    /* stock: plenty (50% or more left) */
      --s-low: #facc15;   /* stock: running low (20–50%) */
      --s-crit: #ff0026;  /* stock: critical (under 20%) */
      --chart: #16a34a;   /* single-series chart bars */
      --p1: #c0392b;      /* priority: high */
      --p2: #d97706;      /* priority: medium */
      --p3: #64748b;      /* priority: regular */
      --ok: #15803d;      /* success */
      --hd: 'Bricolage Grotesque', system-ui, sans-serif;
      box-sizing: border-box;
    }

    /* Dark colors: used when the user picks Dark, or picks Auto and their device is in dark mode */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme=light]) {
        --bg: #070a08;
        --card: #111813;
        --tx: #e6efe8;
        --mu: #8da394;
        --bd: #223028;
        --pr: #000;
        --prt: #e6efe8;
        --ok: #4ade80;
        --sb: #000;
        --sbt: #e6efe8;
        --sbh: #ffffff1f;
        --chart: #4ade80;
        color-scheme: dark;
      }
    }
    :root[data-theme=dark] {
      --bg: #070a08;
      --card: #111813;
      --tx: #e6efe8;
      --mu: #8da394;
      --bd: #223028;
      --pr: #000;
      --prt: #e6efe8;
      --ok: #4ade80;
      --sb: #000;
      --sbt: #e6efe8;
      --sbh: #ffffff1f;
      --chart: #4ade80;
      color-scheme: dark;
    }
    :root[data-theme=light] { color-scheme: light; }

    body, .card, .box, input, select { transition: background-color .3s, color .3s, border-color .3s; }

    /* Light / Dark / Auto switch (top bar, and the corner of the login screen) */
    .theme-btn { min-width: 84px; }
    #login .theme-btn { position: fixed; top: 14px; right: 14px; z-index: 5; background: var(--card); }

    /* ===================== Base ===================== */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 14px/1.45 system-ui, Segoe UI, sans-serif;
    }

    button, input, select { font: inherit; color: inherit; }
    h1, h2, h3 { font-family: var(--hd); margin: 0; }
    :focus-visible { outline: 3px solid var(--ac); outline-offset: 2px; }

    /* ===================== Buttons & form fields ===================== */
    .btn {
      background: var(--pr);
      color: var(--prt);
      border: 0;
      padding: 9px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: transform .15s, box-shadow .15s;
    }
    .btn:hover  { transform: translateY(-1px); box-shadow: 0 4px 12px #0003; }
    .btn:active { transform: scale(.97); }
    .btn.o { background: none; color: var(--tx); border: 1px solid var(--bd); box-shadow: none; }  /* outline */
    .btn.s { padding: 5px 10px; font-size: 12px; }                                                /* small */
    .btn.a { background: var(--ac); color: var(--act); box-shadow: var(--glow); }                                           /* accent */

    input, select {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 9px;
      width: 100%;
    }
    input { cursor: text; caret-color: var(--tx); }
    input[type=checkbox], input[type=file] { cursor: pointer; }

    /* Password field with our own Show/Hide button (the browser's built-in eye is unreliable, so it's hidden) */
    .pw { position: relative; }
    .pw input { padding-right: 62px; }
    .pw .eye {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 0;
      color: var(--mu);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .pw .eye:hover { color: var(--tx); background: var(--bg); }
    input::-ms-reveal, input::-ms-clear { display: none; }

    label {
      display: block;
      font-size: 12px;
      color: var(--mu);
      margin: 10px 0 3px;
    }

    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }

    /* Checkbox lists (vulnerability categories, proof checks) */
    input[type=checkbox] { width: auto; margin: 2px 0 0; flex: none; }
    .cks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
    .cks.one { grid-template-columns: 1fr; }
    .cks label {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      margin: 0;
      font-size: 13px;
      color: var(--tx);
      cursor: pointer;
    }
    .cks label.off { color: var(--mu); cursor: default; }
    .hint { font-size: 12px; color: var(--mu); min-height: 16px; margin-top: 3px; }
    .actions { display: flex; gap: 8px; margin-top: 14px; }

    /* ===================== Login screen ===================== */
    #login { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }

    .hero {
      background: radial-gradient(circle at 85% 110%, #14532d 0, #0b0f0c 60%);
      color: #fff;
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .hero h1 { font-size: clamp(30px, 4.2vw, 52px); line-height: 1.05; font-weight: 800; max-width: 11em; }
    .hero p  { max-width: 30em; color: #a9bcae; }

    .ring {
      position: absolute;
      right: -90px;
      bottom: -90px;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      border: 2px solid var(--ac);
      opacity: .5;
      box-shadow: 0 0 30px #86efac88, inset 0 0 30px #86efac55;
      animation: pulse 3.2s ease-out infinite;
    }
    .ring.r2 { animation-delay: 1.6s; }

    .mini { margin-top: 26px; max-width: 340px; }
    .mini div {
      display: flex;
      justify-content: space-between;
      background: #ffffff14;
      border-radius: 8px;
      padding: 9px 12px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .mini .x1 { animation: up 5s ease-in-out infinite; }
    .mini .x2 { animation: down 5s ease-in-out infinite; }

    .side { display: grid; place-items: center; padding: 20px; }

    .box {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      animation: pop .3s ease;
    }
    .box.wide { max-width: 520px; }

    .shake { animation: shake .35s; }
    .err { color: var(--p1); font-size: 12px; min-height: 16px; margin-top: 8px; }

    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .chip {
      border: 1px dashed var(--bd);
      border-radius: 99px;
      padding: 3px 10px;
      font-size: 12px;
      cursor: pointer;
      background: none;
    }

    /* ===================== App layout ===================== */
    #app { display: none; min-height: 100vh; }

    /* The menu slides in from the left when ☰ is pressed, so pages get the full width */
    aside {
      width: 250px;
      max-width: 85vw;
      background: var(--sb);
      color: var(--sbt);
      border-right: 1px solid var(--bd);
      padding: 16px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      overflow: auto;
      z-index: 8;
      transform: translateX(-100%);
      transition: transform .25s ease, background-color .3s, color .3s;
    }
    aside .theme-btn { width: 100%; margin-top: 14px; color: var(--sbt); }
    aside.open { transform: none; box-shadow: 8px 0 30px #0005; }
    aside .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    aside h2 { font-size: 19px; }
    aside .x { background: none; border: 0; color: inherit; font-size: 22px; cursor: pointer; padding: 4px 8px; }

    #scrim { position: fixed; inset: 0; background: #0006; z-index: 7; display: none; }
    #scrim.open { display: block; }

    .menu-btn {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 8px;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
      flex: none;
    }
    .top .left { display: flex; align-items: center; gap: 10px; }
    aside a {
      display: block;
      padding: 9px 11px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 2px;
      opacity: .8;
      transition: all .2s;
    }
    aside a:hover { opacity: 1; background: var(--sbh); transform: translateX(3px); }
    aside a.on    { background: var(--ac); color: var(--act); opacity: 1; font-weight: 700; box-shadow: var(--glow); }

    main { padding: 22px; max-width: 1180px; margin: 0 auto; }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 8px;
      flex-wrap: wrap;
    }
    h1#title { font-size: 26px; }
    .in { animation: fade .35s ease; }

    /* ===================== Cards, tables & tags ===================== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }
    .stat b    { font-family: var(--hd); font-size: 30px; display: block; }
    .stat span { color: var(--mu); font-size: 12px; }
    .warn { border-left: 4px solid var(--ac); }

    .tw { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid var(--bd);
      white-space: nowrap;
    }
    th { color: var(--mu); font-size: 12px; }

    .tag { padding: 2px 9px; border-radius: 99px; color: #fff; font-size: 11px; font-weight: 700; }
    .t1 { background: var(--p1); }
    .t2 { background: var(--p2); }
    .t3 { background: var(--p3); }
    .t0 { background: var(--mu); }

    .bar   { height: 9px; background: var(--bd); border-radius: 9px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--s-ok); border-radius: 9px; animation: grow 1s ease-out; }
    .bar i.low  { background: var(--s-low); }
    .bar i.crit { background: var(--s-crit); }

    .note {
      background: var(--bg);
      border: 1px dashed var(--bd);
      border-radius: 8px;
      padding: 9px;
      color: var(--mu);
      font-size: 12px;
      margin-top: 10px;
    }

    /* ===================== Priority queue cards ===================== */
    .q {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px;
      border: 1px solid var(--bd);
      border-radius: 10px;
      margin-bottom: 8px;
      background: var(--card);
      animation: fade .4s both;
    }
    .q .n {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--bg);
      display: grid;
      place-items: center;
      font-weight: 800;
    }
    .q .g { flex: 1; }
    .q.first    { border-color: var(--ac); box-shadow: 0 0 0 2px var(--ac) inset, 0 0 24px #86efac77; }
    .q.first .n { background: var(--ac); color: var(--act); }
    .q.out      { animation: out .5s forwards; }

    /* ===================== Modal, toast & tutorial ===================== */
    #modal {
      position: fixed;
      inset: 0;
      background: #000a;
      display: none;
      place-items: center;
      padding: 14px;
      z-index: 9;
      overflow: auto;
    }

    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translate(-50%, 80px);
      background: var(--ok);
      color: #fff;
      padding: 10px 18px;
      border-radius: 9px;
      z-index: 10;
      transition: transform .35s cubic-bezier(.2, 1.4, .4, 1);
    }
    #toast.show { transform: translate(-50%, 0); }

    /* Warning bar shown just before an automatic logout */
    #idle {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 11;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 16px;
      background: var(--s-low);
      color: #1f1400;
      font-weight: 600;
    }
    #idle.show { display: flex; }

    /* ===================== Live updates indicator ===================== */
    .live { font-size: 12px; color: var(--mu); margin-right: 8px; white-space: nowrap; }
    .live::before { content: "●"; margin-right: 4px; color: var(--mu); }
    .live.on::before { color: var(--chart); text-shadow: 0 0 8px var(--chart); }
    #view.quiet * { animation: none !important; }

    /* ===================== Charts ===================== */
    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
    .charts .card { margin: 0; }
    .chart svg { width: 100%; height: auto; display: block; margin-top: 8px; }
    .chart .ax   { fill: var(--mu); font-size: 11px; }
    .chart .lbl  { fill: var(--tx); font-size: 12px; }
    .chart .gl   { stroke: var(--bd); stroke-width: 1; }
    .chart .base { stroke: var(--mu); stroke-width: 1; }
    .chart .b    { fill: var(--chart); }
    .chart .hit  { fill: transparent; }
    .chart .col:hover .hit { fill: var(--bd); opacity: .45; }
    .chart details { margin-top: 6px; font-size: 12px; color: var(--mu); }
    .chart details table { margin-top: 6px; }
    #tip {
      position: fixed;
      z-index: 12;
      pointer-events: none;
      background: var(--card);
      color: var(--tx);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      box-shadow: 0 6px 20px #0003;
      display: none;
      white-space: nowrap;
    }

    /* ===================== Map of sites ===================== */
    .map { height: 380px; border-radius: 10px; margin-top: 10px; isolation: isolate; border: 1px solid var(--bd); }
    .map.small { height: 300px; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--mu); margin-top: 8px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    .leaflet-popup-content { font: 13px/1.45 system-ui, Segoe UI, sans-serif; }

    /* Truck on the way (estimated position) */
    .truck { display: grid; justify-items: center; }
    .truck span { font-size: 22px; line-height: 30px; filter: drop-shadow(0 1px 2px #0009); }
    .truck b {
      font: 700 10px/1 system-ui, sans-serif;
      background: var(--card);
      color: var(--tx);
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 2px 4px;
      white-space: nowrap;
      margin-top: -3px;
    }
    .truck.late b { border-color: var(--s-crit); color: var(--s-crit); }

    /* ===================== Guided tour ===================== */
    #tourBlock { position: fixed; inset: 0; z-index: 20; display: none; }
    #tourHole {
      position: fixed;
      z-index: 21;
      display: none;
      pointer-events: none;
      border-radius: 10px;
      box-shadow: 0 0 0 9999px #000000a6, 0 0 0 3px var(--ac), 0 0 24px 4px var(--ac);
      transition: left .2s, top .2s, width .2s, height .2s;
    }
    #tourHole.key {
      box-shadow: 0 0 0 9999px #000000a6, 0 0 0 3px var(--s-low), 0 0 28px 6px var(--s-low);
      animation: keyPulse 1.4s ease-in-out infinite;
    }
    #tourHole.none { box-shadow: 0 0 0 9999px #000000a6; animation: none; }
    @keyframes keyPulse {
      50% { box-shadow: 0 0 0 9999px #000000a6, 0 0 0 6px var(--s-low), 0 0 44px 14px var(--s-low); }
    }
    #tourTip {
      position: fixed;
      z-index: 22;
      display: none;
      width: min(360px, calc(100vw - 24px));
      background: var(--card);
      color: var(--tx);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 12px 40px #0006;
      transition: left .2s, top .2s;
    }
    #tourTip .badge {
      display: inline-block;
      background: var(--s-low);
      color: #1f1400;
      font-size: 11px;
      font-weight: 700;
      border-radius: 99px;
      padding: 2px 9px;
      margin-bottom: 6px;
    }
    #tourTip .step { color: var(--mu); font-size: 12px; }

    /* ===================== QR claim scan ===================== */
    #qrv video { border-radius: 8px; }

    .dots      { display: flex; gap: 5px; margin: 14px 0; }
    .dots i    { height: 5px; flex: 1; border-radius: 4px; background: var(--bd); transition: background .3s; }
    .dots i.on { background: var(--ac); }

    .demo { background: var(--bg); border-radius: 10px; padding: 10px; margin: 10px 0; overflow: hidden; }
    .demo div {
      display: flex;
      justify-content: space-between;
      background: var(--card);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .demo .x1 { animation: up 4s ease-in-out infinite; }
    .demo .x2 { animation: down 4s ease-in-out infinite; }

    /* ===================== Animations ===================== */
    @keyframes pulse {
      0%   { transform: scale(.4); opacity: .7; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    @keyframes up {
      0%, 30%  { transform: translateY(0); }
      50%, 85% { transform: translateY(-44px); }
      100%     { transform: translateY(0); }
    }
    @keyframes down {
      0%, 30%  { transform: translateY(0); }
      50%, 85% { transform: translateY(44px); }
      100%     { transform: translateY(0); }
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(.95) translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes shake {
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    @keyframes fade {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes grow { from { width: 0 !important; } }
    @keyframes out  { to { opacity: 0; transform: translateX(60px); } }

    /* ===================== Phones & reduced motion ===================== */
    @media (max-width: 760px) {
      #login { grid-template-columns: 1fr; }
      .hero { padding: 28px; }
      main { padding: 12px; }
      .two, .cks { grid-template-columns: 1fr; }
    }

    /* Printing a report: only the report, on white paper, without buttons */
    @media print {
      body { background: #fff; }
      body * { visibility: hidden; }
      #rp, #rp * { visibility: visible; color: #000 !important; }
      #rp { position: absolute; left: 0; top: 0; width: 100%; border: 0; padding: 0; }
      #rp button { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>
  <!-- ===================== Login screen ===================== -->
  <div id="login">
    <section class="hero">
      <h1>Relief goes to the people who need it most.</h1>
      <p>Priority is set by vulnerability and household need. Income, status and donations never move anyone up the queue.</p>
      <div class="mini">
        <div class="x1"><span>Jose · PWD · very low income</span><b>#1</b></div>
        <div class="x2"><span>Carlo · PWD · high income</span><b>#2</b></div>
      </div>
      <i class="ring"></i>
      <i class="ring r2"></i>
    </section>

    <section class="side">
      <div class="box" id="lbox"></div>
    </section>
    <button class="btn o s theme-btn" onclick="cycleTheme()" title="Switch between light, dark and your device's setting"></button>
  </div>

  <!-- ===================== Main app ===================== -->
  <div id="app">
    <aside id="menu">
      <div class="head">
        <h2>ReliefSys</h2>
        <button class="x" onclick="menu(false)" aria-label="Close menu">×</button>
      </div>
      <nav id="nav"></nav>
      <button class="btn o s theme-btn" onclick="cycleTheme()" title="Switch between light, dark and your device's setting"></button>
    </aside>
    <div id="scrim" onclick="menu(false)"></div>

    <main>
      <div class="top">
        <div class="left">
          <button class="menu-btn" onclick="menu(true)" aria-label="Open menu" data-tour="menu">☰</button>
          <h1 id="title"></h1>
        </div>
        <div>
          <span id="live" class="live" title="Changes made on other devices appear here automatically">Connecting…</span>
          <span id="who" style="color:var(--mu);margin-right:8px"></span>
          <button class="btn o s theme-btn" onclick="cycleTheme()" title="Switch between light, dark and your device's setting"></button>
          <button class="btn o s" onclick="tour(0)" data-tour="help">How to use</button>
          <button class="btn o s" onclick="changePw()">Change password</button>
          <button class="btn o s" onclick="logout()">Log out</button>
        </div>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <div id="modal"><div class="box wide" id="mbox"></div></div>
  <div id="toast"></div>
  <div id="idle" role="alert">
    <span id="idleMsg"></span>
    <button class="btn s" onclick="stayIn()">Stay logged in</button>
  </div>

  <div id="tip"></div>

  <!-- Guided tour: click blocker, spotlight, and the step bubble -->
  <div id="tourBlock"></div>
  <div id="tourHole"></div>
  <div id="tourTip" role="dialog" aria-live="polite"></div>

  <!-- QR code scanner library (PhilSys ID scan on sign-up, and claim cards at distribution) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <!-- QR code maker (printed claim cards) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
  <!-- Map of sites -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <!-- Supabase client (database + login) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>

  <script>
    /* =========================================================
       DATA
       ========================================================= */

    // Vulnerability category -> priority tier (1 = highest)
    const CAT = {
      "Pregnant woman": 1,
      "Senior citizen": 1,
      "Person with disability (PWD)": 1,
      "Severe illness": 1,
      "Single parent household": 2,
      "Indigent": 2,
      "Regular household": 3
    };

    const PL = { 1: "High", 2: "Medium", 3: "Regular" };

    const SENIOR = "Senior citizen";      // never ticked by hand: set from the birthdate (age 60+, RA 9994)
    const REG = "Regular household";      // used only when no other category applies
    const MAX_AGE = 120;                  // older birthdates are rejected as impossible

    // What the verifier must see before a category counts
    const PROOF = {
      "Pregnant woman":               "Prenatal record or medical certificate",
      "Senior citizen":               "Senior Citizen ID, or the birthdate on a valid ID",
      "Person with disability (PWD)": "PWD ID or medical certificate",
      "Severe illness":               "Medical certificate",
      "Single parent household":      "Solo Parent ID or barangay certification",
      "Indigent":                     "Certificate of indigency"
    };

    // Monthly household income brackets (index 0 = poorest)
    const INC = ["Below ₱10,000", "₱10,000–20,000", "₱20,000–50,000", "Above ₱50,000"];

    const IDS = [
      "PhilSys National ID",
      "PWD ID",
      "Senior Citizen ID",
      "Voter's ID",
      "Driver's License",
      "Barangay certificate (no ID yet)"
    ];

    // ----- Supabase connection -----
    // The publishable key is meant to be public. The database's Row Level Security rules
    // (supabase/schema.sql) decide what each role can read or change. Never put the secret key here.
    const SUPABASE_URL = "https://hhelbuhqouomekjhuwuo.supabase.co";
    const SUPABASE_KEY = "sb_publishable_xa6nceM9RVmL77JRP5X8rg_MoFhIU3i";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const EMAIL_DOMAIN = "@reliefsys.local";   // usernames log in as <username>@reliefsys.local

    // Everything below is loaded from the database by load() after login.
    // P = every account's username and role (to show who registered / verified)
    // A = accounts with sign-up details, for the Users page (Admins only: idn is the full ID number)
    // R = pending "forgot password" requests (Admins only)
    let P = [], A = [], R = [];

    // Beneficiaries  (dob = birthdate, fam = family size, cats = claimed categories (senior is added
    //                 from the birthdate), inc = income bracket, idt = ID type, idn = last 4 of the ID number
    //                 (the full number never leaves the database), ver = ID verified, done = served at least once,
    //                 last = date of their last relief pack, code = claim card code (printed as a QR),
    //                 by/verBy = who registered/verified,
    //                 flags = warnings that need a closer look)
    let B = [];

    // Days a family waits before they can receive relief again (app_settings in the database)
    let WAIT = 7;

    // Sponsors
    let S = [];

    // Relief categories: what the goods are for (DSWD / Sphere-style groupings)
    const CATS = ["Food", "Water", "Hygiene & Sanitation", "Health / Medical", "Shelter", "Clothing", "Household"];

    // How an item is counted. Stock is always stored in the base unit; each unit says how many base units it is.
    const MEASURES = {
      volume: { label: "Liquid (by volume)",     base: "L",   units: { L: 1, mL: 0.001, gal: 3.785 } },
      mass:   { label: "Solid / bulk (by weight)", base: "kg",  units: { kg: 1, g: 0.001, lb: 0.4536 } },
      count:  { label: "Pieces / kits (by count)", base: "pcs", units: { pcs: 1 } }
    };

    // The usual way to count each category, pre-selected in "Add relief item" (it can still be changed).
    // Clothes, kits and tarps are handed out as pieces, never by weight.
    const CAT_MEASURE = {
      "Food": "mass", "Water": "volume", "Hygiene & Sanitation": "count", "Health / Medical": "count",
      "Shelter": "count", "Clothing": "count", "Household": "count"
    };

    // Date n days from today (used for "expires within a week")
    const inDays = n => plusDays(today(), n);

    // Inventory  (don = donated, dist = distributed, per = amount given per family, all in the base unit)
    // lots = stock batches still on hand. Perishable lots have an expiry date and go out soonest-expiring first (FEFO).
    let I = [];

    // Distribution history
    let D = [];

    // Donation records  (got = what was handed over, q = amount added to stock in the base unit)
    let DON = [];

    // Stock movements: hand adjustments and write-offs (q is signed: + added, − removed)
    let M = [];
    const MOVES = {
      damaged:      "Damaged",
      lost:         "Lost / stolen",
      recount_less: "Recount: less than recorded",
      recount_more: "Recount: more than recorded",
      expired:      "Expired (written off)",
      sorted_out:   "Sorted / repacked: taken",
      sorted_in:    "Sorted / repacked: made"
    };
    const HAND_ADJ = ["damaged", "lost", "recount_less", "recount_more"];   // the ones picked in "Stock adjustment"

    // Sites (warehouses, distribution sites, evacuation centers) and transfers between them.
    // Each stock batch in I[].lots has `site` (where it is) and `tr` (the transfer it's travelling on).
    let SITES = [], TR = [];
    const SITE_KINDS = ["Warehouse", "Distribution site", "Evacuation center"];

    // Areas (province / municipality) and their status, and per-site counts of families still to serve
    // (NEED comes from the database as numbers only, so even Logistics can see where goods are needed)
    let AREAS = [], NEED = [];
    const AREA_STATUS = ["Normal", "Signal 1", "Signal 2", "Signal 3", "Signal 4", "Signal 5", "State of Calamity"];
    let serveSite = null;   // site chosen in the serve screen

    // me = the logged-in account's id in the database
    let role = "", user = "", me = "", cur = "Dashboard", toured = false, busy = false;

    // Pages each role can open. Logistics handles the goods, not the people, so it never sees beneficiaries.
    const MENU = {
      "Admin":             ["Dashboard", "Beneficiaries", "Priority Queue", "Inventory", "Sites & Transfers", "Stock Movements", "Sponsors & Donations", "Distribution History", "Reports", "Users"],
      "LGU Personnel":     ["Dashboard", "Beneficiaries", "Priority Queue", "Inventory", "Sites & Transfers", "Sponsors & Donations", "Distribution History", "Reports"],
      "NGO Staff":         ["Dashboard", "Beneficiaries", "Priority Queue", "Inventory", "Sites & Transfers", "Sponsors & Donations", "Distribution History", "Reports"],
      "Logistics Officer": ["Dashboard", "Inventory", "Sites & Transfers", "Stock Movements", "Sponsors & Donations", "Distribution History", "Reports"],
      "Volunteer":         ["Dashboard", "Beneficiaries", "Priority Queue"]
    };


    /* =========================================================
       HELPERS
       ========================================================= */

    const $ = id => document.getElementById(id);
    const unit = x => MEASURES[x.measure].base;                           // base unit of an item
    const num = n => +(+n).toFixed(3);                                    // trims float noise (0.1 + 0.2)
    const expired = lot => lot.exp && lot.exp < today();                  // yyyy-mm-dd compares as text
    const usable = x => x.lots.filter(l => !expired(l));
    const rem = x => num(usable(x).reduce((s, l) => s + l.q, 0));         // stock that can still be given out
    const spoiled = x => num(x.lots.filter(expired).reduce((s, l) => s + l.q, 0));
    // Color of an item's stock bar: plenty, running low (under 50%) or critical (under 20%)
    const level = x => { const r = x.don ? rem(x) / x.don : 0; return r < .2 ? "crit" : r < .5 ? "low" : ""; };
    const nextExp = x => usable(x).map(l => l.exp).filter(Boolean).sort()[0] || "";
    const soon = x => nextExp(x) && nextExp(x) <= inDays(7);              // expires within a week
    const families = x => Math.floor(rem(x) / x.per);                     // families (or people) this item can still cover
    const whom = x => x.basis === "person" ? "person" : "family";
    const reach = x => !x.give ? "not given out" : `${families(x)} ${x.basis === "person" ? "people" : "families"}`;
    const share = (x, fam) => num(x.per * (x.basis === "person" ? fam : 1));   // what one family gets
    const given = () => I.filter(x => x.give);                            // items handed to families

    // Stock at one site (not counting goods on a truck), and stock on trucks
    const remAt = (x, site) => num(usable(x).filter(l => l.site === site && !l.tr).reduce((s, l) => s + l.q, 0));
    const transit = x => num(x.lots.filter(l => l.tr).reduce((s, l) => s + l.q, 0));
    const siteName = id => (SITES.find(s => s.id === id) || {}).name || "—";
    const waybill = id => "WB-" + String(id).padStart(5, "0");

    const staff = () => role === "Admin" || role === "LGU Personnel";     // can verify / delete
    const logi = () => role === "Admin" || role === "Logistics Officer";  // can adjust / write off stock
    const people = () => role !== "Logistics Officer";                    // can see beneficiary records
    // The site this account is assigned to by the Admin (Admins are never locked to one)
    const lockedSite = () => role === "Admin" ? null : (P.find(p => p.id === me) || {}).site_id || null;
    const pad2 = n => String(n).padStart(2, "0");
    // Dates are always Philippine dates (yyyy-mm-dd), like the database, whatever time zone the device is set to.
    // "en-CA" is used only because it writes dates as yyyy-mm-dd.
    const phDay = t => new Date(t).toLocaleDateString("en-CA", { timeZone: "Asia/Manila" });
    const today = () => phDay(Date.now());
    const minDob = () => (new Date().getFullYear() - MAX_AGE) + today().slice(4);
    const plusDays = (d, n) => {                                          // yyyy-mm-dd + n days
      const x = new Date(d + "T00:00");
      x.setDate(x.getDate() + n);
      return `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}`;
    };
    const niceDate = d => new Date(d + "T00:00").toLocaleDateString("en-PH", { month: "short", day: "numeric", year: "numeric" });

    // Relief rounds: a family can receive again WAIT days after their last pack.
    // The database enforces this too; the page uses it to build the queue and warn early.
    const nextServe = b => b.last ? plusDays(b.last, WAIT) : "";
    const canServe = b => !b.last || today() >= nextServe(b);

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
    const mask = s => "•••• " + esc(s.slice(-4));

    // Age in whole years from a yyyy-mm-dd birthdate. NaN if the date is missing or not real (e.g. Feb 31).
    function ageOf(dob) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dob || "");
      if (!m) return NaN;
      const y = +m[1], mo = +m[2], d = +m[3];
      const check = new Date(y, mo - 1, d);
      if (check.getFullYear() !== y || check.getMonth() !== mo - 1 || check.getDate() !== d) return NaN;

      const t = new Date();
      const beforeBirthday = t.getMonth() + 1 < mo || (t.getMonth() + 1 === mo && t.getDate() < d);
      return t.getFullYear() - y - (beforeBirthday ? 1 : 0);
    }

    // A person's categories. Senior always comes from the birthdate, never from what was ticked.
    function cats(b) {
      const c = b.cats.filter(x => x !== SENIOR && x !== REG);
      if (ageOf(b.dob) >= 60) c.push(SENIOR);
      return c.length ? c : [REG];
    }

    const tier  = b => Math.min(...cats(b).map(c => CAT[c] || 3));       // best (lowest) tier; unknown counts as regular
    const vulns = b => cats(b).filter(c => CAT[c] === 1).length;          // how many high-priority needs
    const tag = b => `<span class="tag t${tier(b)}">${PL[tier(b)]}</span>`;

    // Warnings that need a closer look before verification
    function flagsOf(b) {
      const a = ageOf(b.dob), c = cats(b), f = [];
      if (a > 100) f.push(`Age ${a}: confirm the birthdate on the ID`);
      if (c.includes("Pregnant woman") && (a < 12 || a > 55)) f.push(`Pregnant at age ${a}: confirm with a prenatal record`);
      if (c.includes(SENIOR) && b.idt === IDS[5]) f.push("Senior with no ID: confirm the birthdate another way");
      if (c.includes("Person with disability (PWD)") && b.idt !== IDS[1]) f.push("PWD without a PWD ID: check medical proof");
      return f;
    }

    function toast(message) {
      const t = $("toast");
      t.textContent = message;
      t.className = "show";
      clearTimeout(t.h);
      t.h = setTimeout(() => t.className = "", 2400);
    }

    // Priority Queue: best vulnerability tier first, then more high-priority needs first
    // (a pregnant PWD before someone only pregnant), then household income (poorest first),
    // then registration order. Only ID-verified people enter, and only once their waiting period is over.
    // With a site: that site's families plus families with no site yet. Without: everyone (dashboard totals).
    const queue = site => B
      .filter(b => b.ver && canServe(b) && (site == null || !b.site || b.site === site))
      .sort((a, b) => tier(a) - tier(b) || vulns(b) - vulns(a) || a.inc - b.inc || a.id - b.id);

    const pend = () => B.filter(b => !b.ver);


    /* =========================================================
       DATABASE (Supabase)
       load() fills the arrays above, so the pages read them as before.
       Every change is written to the database first, then load() runs again.
       ========================================================= */

    const uname = id => (P.find(p => p.id === id) || {}).username || "—";

    // Turns a database error into a message people can act on
    function errMsg(e) {
      if (e.code === "23505") return "That already exists (same ID number, name + birthdate, or item name)";
      if (e.code === "42501") return "Your role isn't allowed to do that";
      if (e.code === "23503") return "Can't delete: other records depend on this one (e.g. relief already given)";
      if (e.code === "23514") return "That value isn't allowed. Pick one from the list";
      return e.message || "Something went wrong. Check your internet connection";
    }

    async function load() {
      const [pr, ben, sp, it, lots, don, dist, mov, st, trs, cfg, ar, nd] = await Promise.all([
        sb.from("profiles").select("id, username, name, role, status, site_id").order("created_at"),
        sb.from("beneficiaries")
          .select("id, name, brgy, dob, fam, cats, inc, id_type, id_last4, verified, served, last_served, site_id, registered_by, verified_by")
          .order("id"),
        sb.from("sponsors").select("*").order("id"),
        sb.from("item_totals").select("*").order("id"),
        sb.from("stock_lots").select("item_id, qty, exp, site_id, transfer_id").gt("qty", 0),
        sb.from("donations").select("date, sponsor_id, item_id, received_as, qty, exp").order("id", { ascending: false }),
        sb.from("distributions")
          .select("id, date, beneficiary_id, served_by, served_role, skip_reason, approved_by, distribution_items(item_id, qty)")
          .order("id", { ascending: false }),
        sb.from("stock_movements").select("at, item_id, kind, qty, reason, by_user, site_id").order("id", { ascending: false }),
        sb.from("sites").select("*").order("id"),
        sb.from("transfers").select("*, transfer_items(item_id, qty_sent, qty_received)").order("id", { ascending: false }),
        sb.from("app_settings").select("serve_wait_days").maybeSingle(),
        sb.from("areas").select("*").order("name"),
        sb.rpc("site_need")   // counts only, so every role can see where goods are needed
      ]);
      // If one read fails, say which table and the database's own message (helps find a missing SQL update)
      const all = [pr, ben, sp, it, lots, don, dist, mov, st, trs, cfg, ar, nd];
      const names = ["profiles", "beneficiaries", "sponsors", "item_totals", "stock_lots", "donations",
                     "distributions", "stock_movements", "sites", "transfers", "app_settings", "areas", "site_need"];
      const bad = all.findIndex(r => r.error);
      if (bad >= 0) {
        const e = all[bad].error;
        console.error("load() failed on", names[bad], e);
        toast(`Can't load ${names[bad]}: ${e.message || errMsg(e)}`);
        return false;
      }

      P = pr.data;
      if (cfg.data) WAIT = cfg.data.serve_wait_days;
      B = ben.data.map(b => ({
        id: b.id, name: b.name, brgy: b.brgy, dob: b.dob, fam: b.fam, cats: b.cats,
        inc: b.inc, idt: b.id_type, idn: b.id_last4, ver: b.verified, done: b.served, last: b.last_served || "", code: "", site: b.site_id,
        byId: b.registered_by, by: uname(b.registered_by), verBy: b.verified_by ? uname(b.verified_by) : ""
      }));
      B.forEach(b => b.flags = flagsOf(b));
      // Claim codes come only to LGU and Admin, who print the cards. Contact numbers never come to the page.
      if (staff()) {
        const cc = await sb.rpc("claim_codes");
        if (cc.error) { console.error("load() failed on claim_codes", cc.error); toast(`Can't load claim codes: ${cc.error.message}`); return false; }
        cc.data.forEach(r => { const b = B.find(x => x.id === r.id); if (b) b.code = r.claim_code || ""; });
      }
      S = sp.data;
      I = it.data.map(x => ({
        id: x.id, item: x.name, cat: x.cat, measure: x.measure, per: +x.per, perish: x.perish,
        basis: x.basis, give: x.distribute,
        don: num(x.don), dist: num(x.dist), adj: num(x.adj),
        lots: lots.data.filter(l => l.item_id === x.id)
          .map(l => ({ q: +l.qty, exp: l.exp || "", site: l.site_id, tr: l.transfer_id }))
      }));
      SITES = st.data;
      TR = trs.data;
      AREAS = ar.data;
      NEED = nd.data;
      if (!SITES.some(s => s.id === serveSite)) serveSite = (SITES.find(s => s.kind !== "Warehouse") || SITES[0] || {}).id;
      if (lockedSite()) serveSite = lockedSite();   // staff assigned to a site always work there

      const itemName = id => (I.find(x => x.id === id) || {}).item || "—";
      DON = don.data.map(d => ({
        date: d.date, sp: (S.find(s => s.id === d.sponsor_id) || {}).name || "—",
        item: itemName(d.item_id), got: d.received_as, q: +d.qty, exp: d.exp || ""
      }));
      D = dist.data.map(d => ({
        id: d.id, date: d.date, bid: d.beneficiary_id,
        ben: (B.find(b => b.id === d.beneficiary_id) || {}).name || (people() ? "—" : "Private"),
        items: d.distribution_items.map(di => {
          const x = I.find(i => i.id === di.item_id);
          return `${itemName(di.item_id)} ${+di.qty} ${x ? unit(x) : ""}`;
        }).join(", "),
        by: `${uname(d.served_by)} · ${d.served_role || ""}`,
        skip: d.skip_reason || "", okBy: d.approved_by && d.approved_by !== d.served_by ? uname(d.approved_by) : ""
      }));
      M = mov.data.map(m => ({
        date: phDay(m.at), item: itemName(m.item_id), kind: m.kind, q: +m.qty,
        unit: (x => x ? unit(x) : "")(I.find(i => i.id === m.item_id)), reason: m.reason, by: uname(m.by_user),
        site: m.site_id ? siteName(m.site_id) : "—"
      }));

      // Sign-up details (ID submitted, QR) are only readable by Admins
      A = [];
      R = [];
      if (role === "Admin") {
        const [det, req] = await Promise.all([
          sb.from("account_details").select("*"),
          sb.from("reset_requests").select("id, user_id, note, created_at").eq("status", "Pending").order("id")
        ]);
        if (det.error || req.error) {
          const e = det.error || req.error;
          console.error("load() failed on", det.error ? "account_details" : "reset_requests", e);
          toast(`Can't load ${det.error ? "account_details" : "reset_requests"}: ${e.message}`);
          return false;
        }
        R = req.data;
        A = P.map(p => {
          const d = det.data.find(x => x.id === p.id) || {};
          return { id: p.id, u: p.username, name: p.name, role: p.role, st: p.status, site: p.site_id,
                   idt: d.id_type, idn: d.id_no || "", qr: d.via_qr };
        });
      }
      return true;
    }

    // Runs one database change, reloads the data, and shows `ok` if it worked.
    // Ignores repeat clicks while a save is still running.
    async function act(call, ok) {
      if (busy) return false;
      busy = true;
      document.body.style.cursor = "progress";
      try {
        const { error } = await call;
        if (error) { toast(errMsg(error)); return false; }
        await load();
        if (ok) toast(ok);
        return true;
      } catch (e) {
        toast("Can't reach the database. Check your internet connection");
        return false;
      } finally {
        busy = false;
        document.body.style.cursor = "";
      }
    }


    /* =========================================================
       PHILSYS QR SCAN
       Auto-fills the sign-up form only. The QR signature is not
       verified, so an Admin still checks the ID.
       ========================================================= */

    let qr = null, cam = null;

    // Fake PhilSys-style QR content for demos without a real card
    const SAMPLE_QR = JSON.stringify({
      DateIssued: "July 15, 2023",
      Issuer: "PSA",
      subject: {
        Suffix: "", lName: "Dela Cruz", fName: "Juana", mName: "Santos", sex: "Female",
        DOB: "March 08, 1995", POB: "Lipa City, Batangas", PCN: "1234-5678-9012-3456"
      },
      alg: "EDDSA",
      signature: "demo"
    });

    const digits = s => String(s).replace(/\D/g, "");

    // Reads name, birthdate and card number from the QR text. Returns null if it isn't a PhilSys QR.
    function qrData(text) {
      let j;
      try { j = JSON.parse(text); } catch (e) { return null; }
      if (!j || typeof j !== "object") return null;

      // Field names differ between card versions, so several spellings are accepted
      const s = j.subject || j.sb || j;
      const field = names => {
        for (const key in s) {
          if (names.includes(key.toLowerCase())) return String(s[key] ?? "").trim();
        }
        return "";
      };

      const pcn = field(["pcn"]);
      if (digits(pcn).length !== 16) return null;

      // Birthdate -> yyyy-mm-dd for the date input
      const raw = field(["dob", "birthdate", "date_of_birth"]);
      const d = new Date(raw);
      const pad = n => String(n).padStart(2, "0");
      const dob = /^\d{4}-\d{2}-\d{2}$/.test(raw) ? raw
                : isNaN(d) ? ""
                : `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

      const name = [
        field(["fname", "fn", "first_name"]),
        field(["mname", "mn", "middle_name"]),
        field(["lname", "ln", "last_name"]),
        field(["suffix", "sf"])
      ].filter(Boolean).join(" ");

      return { name, dob, pcn };
    }

    function fillQR(text) {
      const q = qrData(text);
      if (!q) return bad("That QR code isn't from a PhilSys National ID. Type your details instead.");

      qr = q;
      $("s1").value = q.name;
      $("s2").value = q.dob;
      $("s6").value = IDS[0];
      $("s7").value = q.pcn;
      $("err").textContent = "";
      $("qrs").innerHTML = `<b style="color:var(--ok)">✓ Filled from PhilSys QR.</b> Check the details, then finish the form.`;
      toast("PhilSys ID scanned");
    }

    // onText gets the scanned text; onErr shows problems (the sign-up form by default)
    function startCam(onText = fillQR, onErr = bad) {
      if (typeof Html5Qrcode === "undefined") return onErr("The scanner couldn't load. Check your internet connection.");

      stopCam();
      $("qrv").style.display = "block";
      cam = new Html5Qrcode("qrv");
      cam.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 240 },
        text => { stopCam(); onText(text); }
      ).catch(() => {
        stopCam();
        onErr("Camera not available. Upload a photo of the QR code instead.");
      });
    }

    function stopCam() {
      const c = cam;
      cam = null;
      if (c) {
        try {
          (c.isScanning ? c.stop() : Promise.resolve())
            .then(() => c.clear())
            .catch(() => {});
        } catch (e) {}
      }
      if ($("qrv")) $("qrv").style.display = "none";
    }

    function scanFile(file, onText = fillQR, onErr = bad) {
      if (typeof Html5Qrcode === "undefined") return onErr("The scanner couldn't load. Check your internet connection.");

      stopCam();
      const reader = new Html5Qrcode("qrv");
      reader.scanFile(file, false)
        .then(onText)
        .catch(() => onErr("No QR code found. Try a sharper, closer photo of the QR."))
        .finally(() => { try { reader.clear(); } catch (e) {} });
    }

    function showLogin() {
      stopCam();
      $("lbox").className = "box";
      $("lbox").innerHTML = `

          <a style="cursor:pointer;text-decoration:underline;color:var(--mu);font-size:13px" onclick="showForgot()">Forgot password?</a>
        </p>

        <div class="note">New here? Create an account. An Admin approves it before you can log in.</div>`;
    }

    // ----- Forgot password -----
    // Emails here aren't real, so there is no reset link. The request goes to the Admins,
    // who check the person's ID and give them a temporary password in person.
    function showForgot() {
      $("lbox").className = "box";
      $("lbox").innerHTML = `
        <h2 style="font-size:24px">Forgot password</h2>
        <p style="color:var(--mu);margin:4px 0 0">An Admin will check your ID and give you a temporary password.</p>

        <label>Username</label>
        <input id="fu_u" autocomplete="username">
        <label>Message for the Admin (optional)</label>
        <input id="fu_n" maxlength="200" placeholder="e.g. I'm at the Brgy. Sabang hall until 5 PM">

        <div class="err" id="err"></div>
        <button class="btn" style="width:100%;margin-top:6px" onclick="sendForgot()">Send request</button>
        <button class="btn o" style="width:100%;margin-top:8px" onclick="showLogin()">Back to sign in</button>`;
    }

    async function sendForgot() {
      const u = $("fu_u").value.trim().toLowerCase();
      if (!u) return bad("Enter your username.");

      const { error } = await sb.rpc("request_password_reset", { p_username: u, p_note: $("fu_n").value.trim() });
      if (error) return bad(errMsg(error));

      // Same answer whether or not the username exists, so this can't be used to look up accounts
      $("lbox").innerHTML = `
        <h2 style="font-size:24px">Request sent</h2>
        <p>If <b>${esc(u)}</b> is an account here, the Admins can now see your request.</p>
        <div class="note">
          <b>Next:</b> bring a valid ID to an Admin. After checking it, they'll give you a temporary password.
          When you log in with it, you'll choose your own new password.
        </div>
        <button class="btn" style="width:100%;margin-top:12px" onclick="showLogin()">Back to sign in</button>`;
    }

    // ----- New password -----
    // forced = right after logging in with a temporary password (the app stays locked until it's changed)
    function pwForm(forced) {
      return `
        ${forced ? "" : `<label>Current password</label><div class="pw"><input id="pw0" type="password" autocomplete="current-password">${EYE}</div>`}
        <label>New password (6+ characters)</label>
        <div class="pw"><input id="pw1" type="password" autocomplete="new-password">${EYE}</div>
        <label>New password again</label>
        <div class="pw"><input id="pw2" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')savePw(${forced})">${EYE}</div>
        <div class="err" id="${forced ? "err" : "pwerr"}"></div>`;
    }

    function showForcedPw() {
      $("lbox").className = "box";
      $("lbox").innerHTML = `
        <h2 style="font-size:24px">Choose a new password</h2>
        <p style="color:var(--mu);margin:4px 0 0">You logged in with a temporary password from an Admin. Set your own to continue.</p>
        ${pwForm(true)}
        <button class="btn" style="width:100%;margin-top:6px" onclick="savePw(true)">Save and continue</button>
        <button class="btn o" style="width:100%;margin-top:8px" onclick="logout()">Cancel</button>`;
    }

    function changePw() {
      modal(`
        <h3>Change password</h3>
        ${pwForm(false)}
        <div class="actions">
          <button class="btn a" onclick="savePw(false)">Save</button>
          <button class="btn o" onclick="close_()">Cancel</button>
        </div>`);
    }

    async function savePw(forced) {
      const fail = m => forced ? bad(m) : ($("pwerr").textContent = m);
      const p1 = $("pw1").value, p2 = $("pw2").value;
      if (p1.length < 6) return fail("New password needs at least 6 characters.");
      if (p1 !== p2)     return fail("The two new passwords don't match.");

      // Check the current password first, so someone at an unattended screen can't change it
      if (!forced) {
        const { error } = await sb.auth.signInWithPassword({ email: user + EMAIL_DOMAIN, password: $("pw0").value });
        if (error) return fail("Current password is wrong.");
      }

      const { error } = await sb.auth.updateUser({ password: p1 });
      if (error) return fail(/different from the old/i.test(error.message)
        ? "Choose a password different from the old one." : error.message);
      await sb.rpc("password_changed");

      if (forced) return enter();
      close_();
      toast("Password changed");
    }

    function showSignup() {
      qr = null;
      const idOptions = IDS.slice(0, 5).map(x => `<option>${x}</option>`).join("");

      $("lbox").innerHTML = `
        <h2 style="font-size:24px">Create an account</h2>
        <p style="color:var(--mu);margin:4px 0 0">An Admin checks your ID before you can log in. This keeps relief records trustworthy.</p>

    // Shows an error message and shakes the login box
    function bad(message) {
      $("err").textContent = message;
      const box = $("lbox");
      box.classList.remove("shake");
      void box.offsetWidth;   // restart the animation
      box.classList.add("shake");
    }

    async function signup() {
      const g = i => $("s" + i).value.trim();

      if (!g(1) || !g(2) || !g(3) || !g(7) || !g(9)) return bad("Fill in name, birthdate, address, ID number and username.");
      const age = ageOf(g(2));
      if (isNaN(age) || age < 0 || age > MAX_AGE)   return bad("Enter a real birthdate (not in the future, not over " + MAX_AGE + " years ago).");
      if (!/^\w{3,20}$/.test(g(9))) {
        const odd = [...new Set(g(9).replace(/\w/g, ""))].map(c => c === " " ? "spaces" : `"${c}"`);
        return bad("Username: 3–20 letters, numbers or _ only. " + (odd.length ? "Remove " + odd.join(", ") + "."
          : g(9).length < 3 ? "Too short." : `Too long (${g(9).length} characters).`));
      }
      if ($("s10").value.length < 6)                 return bad("Password needs at least 6 characters.");

      // Marked "QR" only if the scanned values were left unchanged
      const viaQR = !!qr
        && g(6) === IDS[0]
        && digits(g(7)) === digits(qr.pcn)
        && g(1) === qr.name
        && g(2) === qr.dob;

      // The database trigger turns this into a Pending profile; it never accepts "Admin" from here
      const { error } = await sb.auth.signUp({
        email: g(9).toLowerCase() + EMAIL_DOMAIN,
        password: $("s10").value,
        options: { data: {
          username: g(9).toLowerCase(), name: g(1), role: g(8), dob: g(2), address: g(3),
          contact: g(4), org: g(5), id_type: g(6), id_no: g(7), via_qr: viaQR
        } }
      });
      if (error) {
        return bad(/already registered|already exists|duplicate|saving new user/i.test(error.message)
          ? "That username is taken. Try another." : error.message);
      }

      await sb.auth.signOut();   // signing up logs you in, but the account isn't approved yet
      showLogin();
      toast("Account submitted · waiting for Admin approval");
    }

    async function login() {
      const username = $("u").value.trim().toLowerCase();
      const { error } = await sb.auth.signInWithPassword({ email: username + EMAIL_DOMAIN, password: $("p").value });
      if (error) return bad(/invalid login credentials/i.test(error.message)
        ? "Wrong username or password." : "Can't log in: " + error.message);
      enter();
    }

    // Opens the app for whoever is signed in. Used after login and when a saved session is found.
    async function enter() {
      const { data: { user: u } } = await sb.auth.getUser();
      if (!u) return showLogin();

      const { data: p } = await sb.from("profiles").select("username, role, status, must_change").eq("id", u.id).single();
      if (!p || p.status !== "Active") {
        await sb.auth.signOut();
        showLogin();
        return bad(!p ? "No profile found for this account. Ask an Admin."
          : p.status === "Pending" ? "Your account is still waiting for Admin approval."
          : "This account is " + p.status.toLowerCase() + ". Ask an Admin.");
      }

      me = u.id;
      role = p.role;
      user = p.username;
      if (p.must_change) return showForcedPw();   // temporary password from an Admin: choose a new one first
      if (!(await load())) return;

      stamp();   // start the inactivity timer fresh
      $("login").style.display = "none";
      $("app").style.display = "block";
      $("who").textContent = user + " · " + role;
      goLive();
      go("Dashboard");
      toast("Login successful");

      // Show the tour on this person's first login in this browser (remembered per account, not per page load)
      const seen = "toured:" + me;
      let first = !toured;
      try { first = !localStorage.getItem(seen); localStorage.setItem(seen, "1"); } catch (e) {}
      if (first) {
        toured = true;
        setTimeout(() => tour(0), 700);
      }
    }

    async function logout() {
      stopLive();
      endTour();
      await sb.auth.signOut();
      role = user = me = "";
      P = A = R = B = S = I = D = DON = M = SITES = TR = AREAS = NEED = [];
      $("app").style.display = "none";
      $("login").style.display = "grid";
      showLogin();
    }


    /* =========================================================
       NAVIGATION & MODAL
       ========================================================= */

    // ----- Light / Dark / Auto -----
    // Auto follows the device setting. The choice is saved in this browser only.
    const THEMES = { auto: "◐ Auto", light: "☀ Light", dark: "☾ Dark" };
    function setTheme(t) {
      if (t === "auto") delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = t;
      try { localStorage.setItem("theme", t); } catch (e) {}
      document.querySelectorAll(".theme-btn").forEach(b => b.textContent = THEMES[t]);
      // switch the maps to light/dark tiles
      if (role && cur === "Sites & Transfers") drawMap();
      if (role && cur === "Dashboard") drawMap("dmap");
    }
    function cycleTheme() {
      const now = document.documentElement.dataset.theme || "auto";
      setTheme({ auto: "light", light: "dark", dark: "auto" }[now]);
    }
    setTheme(document.documentElement.dataset.theme || "auto");

    // ----- Auto-logout after inactivity -----
    // Relief-site computers are shared, so an unattended screen logs itself out.
    // The last activity time is saved in the browser, so it also covers other tabs and reopening the page.
    const IDLE_MIN = 15;   // minutes without activity before logging out
    const WARN_SEC = 60;   // warning shown this many seconds before
    let lastAct = Date.now(), idleOn = false;

    function lastActive() {
      let saved = 0;
      try { saved = +localStorage.getItem("lastActive") || 0; } catch (e) {}
      return Math.max(saved, role ? lastAct : 0);
    }
    function stamp() {
      lastAct = Date.now();
      try { localStorage.setItem("lastActive", lastAct); } catch (e) {}
    }

    // Any activity counts, except while the warning is up: then only the button keeps you in
    ["mousemove", "mousedown", "keydown", "touchstart", "scroll", "wheel"].forEach(ev =>
      addEventListener(ev, () => { if (role && !idleOn && Date.now() - lastAct > 5000) stamp(); }, { passive: true }));

    function stayIn() {
      idleOn = false;
      $("idle").classList.remove("show");
      stamp();
    }

    setInterval(async () => {
      if (!role) return;
      const left = IDLE_MIN * 60 - Math.floor((Date.now() - lastActive()) / 1000);
      if (left <= 0) {
        idleOn = false;
        $("idle").classList.remove("show");
        close_();
        menu(false);
        await logout();
        $("err").textContent = `You were logged out after ${IDLE_MIN} minutes of inactivity.`;
      } else if (left <= WARN_SEC) {
        idleOn = true;
        $("idleMsg").textContent = `No activity for a while. You'll be logged out in ${left} s.`;
        $("idle").classList.add("show");
      } else if (idleOn) {
        stayIn();   // activity in another tab kept the session going
      }
    }, 1000);

    // ----- Show / Hide password -----
    // The button keeps focus off the field, so the text cursor stays where it was
    const EYE = `<button type="button" class="eye" onmousedown="event.preventDefault()" onclick="peek(this)" aria-label="Show password">Show</button>`;
    function peek(b) {
      const f = b.previousElementSibling, show = f.type === "password";
      f.type = show ? "text" : "password";
      b.textContent = show ? "Hide" : "Show";
      b.setAttribute("aria-label", show ? "Hide password" : "Show password");
    }

    // Opens or closes the slide-in menu
    function menu(open) {
      $("menu").classList.toggle("open", open);
      $("scrim").classList.toggle("open", open);
    }
    addEventListener("keydown", e => { if (e.key === "Escape") menu(false); });

    // quiet = redraw after a live update: no animations, and the menu stays as it is
    function go(page, quiet) {
      if (!quiet) menu(false);
      cur = page;
      $("title").textContent = page;
      $("nav").innerHTML = MENU[role]
        .map(m => `<a class="${m === page ? "on" : ""}" onclick="go('${m}')">${m}</a>`)
        .join("");

      // Restart the fade-in animation, then draw the page
      const v = $("view");
      if (!quiet) {
        v.className = "";
        void v.offsetWidth;
        v.className = "in";
      }
      v.classList.toggle("quiet", !!quiet);
      v.innerHTML = V[page]();
      if (page === "Sites & Transfers") drawMap();
      if (page === "Dashboard") drawMap("dmap");

      // Count-up animation for the dashboard numbers
      v.querySelectorAll("[data-n]").forEach(e => {
        if (quiet) return (e.textContent = e.dataset.n);
        const n = +e.dataset.n;
        const t0 = performance.now();
        (function step(t) {
          const k = Math.min(1, (t - t0) / 700);
          e.textContent = Math.round(n * k);
          if (k < 1) requestAnimationFrame(step);
        })(t0);
      });
    }

    function modal(html) {
      $("mbox").innerHTML = html;
      $("modal").style.display = "grid";
    }

    function close_() {
      stopCam();
      $("modal").style.display = "none";
      if (redrawLater) { redrawLater = false; if (role) go(cur, true); }
    }
    const modalOpen = () => $("modal").style.display === "grid";

    // ----- Live updates -----
    // Every change in the database adds a row to app_pulse. Each screen listens for it and
    // reloads, so the queue and the stock are the same on every device without refreshing.
    let live = null, liveT = null, redrawLater = false;

    function setLive(on) {
      $("live").classList.toggle("on", on);
      $("live").textContent = on ? "Live" : "Reconnecting…";
      $("live").title = on ? "Changes made on other devices appear here automatically"
        : "Not receiving live updates. Check the internet connection; it keeps trying.";
    }

    function goLive() {
      stopLive();
      live = sb.channel("pulse")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "app_pulse" }, () => {
          clearTimeout(liveT);
          liveT = setTimeout(refresh, 600);   // one reload for a burst of changes
        })
        .subscribe(status => setLive(status === "SUBSCRIBED"));
    }

    function stopLive() {
      clearTimeout(liveT);
      if (live) sb.removeChannel(live);
      live = null;
    }

    async function refresh() {
      if (!role) return;
      if (busy) return (liveT = setTimeout(refresh, 800));   // a save is running: try again right after
      if (!(await load())) return;
      // Never redraw under an open form; do it when the form closes. Reports keep the open report.
      if (modalOpen()) redrawLater = true;
      else if (cur !== "Reports") go(cur, true);
    }

    // Clicking the dark background closes the modal
    $("modal").onclick = e => {
      if (e.target.id === "modal") close_();
    };

      { t: "Scan the claim card", page: "Priority Queue", sel: "[data-tour=scan]", key: true,
        x: "At the table, scan the family's card. If they're first, serving opens right away. If not, it tells you who is ahead, so priority still counts." },
      { t: "Serve and confirm", page: "Priority Queue", sel: [".q.first .btn", "[data-tour=scan]"], key: true,
        x: "Press <b>Serve Next</b>, choose the site you're at, check the goods list and confirm. Only that site's stock is used, and it's saved instantly for every device." },
      { t: "One pack per round", page: "Priority Queue", sel: "[data-tour=round]",
        x: () => `After a pack, a family waits <b>${WAIT} day${WAIT > 1 ? "s" : ""}</b> before they return to the queue. The database blocks repeat claims at every site, and warns you when someone from the same household already got relief.` },
      { t: "Record donations", page: "Sponsors & Donations", sel: "[data-tour=donate]", roles: ["Admin", "Logistics Officer"],
        x: "Add the sponsor, then the donation: bulk or packs and the unit (e.g. 100 bottles × 500 mL). It's converted to the item's base unit. Perishables need an expiry date and go out soonest-expiring first." },
      { t: "Manage the stock", page: "Inventory", sel: ['[onclick^="addAdj("]', "#view .card.tw"], roles: ["Admin", "Logistics Officer"],
        x: "<b>Adjust</b> for damaged, lost or miscounted goods, with a reason that's logged with your name. <b>Sort</b> turns sacks of mixed donations into the items families receive." },
      { t: "Map of sites", page: "Sites & Transfers", sel: "[data-tour=map]",
        x: "Where everything is. 🚚 shows each truck on the way at its <b>estimated</b> position, with an arrival time; it turns red when overdue. Admin or Logistics press <b>Set location</b> to place a new site." },
      { t: "Send goods by truck", page: "Sites & Transfers", sel: "[data-tour=dispatch]", roles: ["Admin", "Logistics Officer"], key: true,
        x: "Dispatch from one site to another and print the <b>waybill</b> for the driver. The receiving site presses <b>Receive</b> and counts what came; any shortage is logged automatically." },
      { t: "Reports", page: "Reports", sel: "[data-tour=reports]",
        x: "Print or save a PDF summary for the LGU, DSWD or sponsors." },
      { t: "Accounts", page: "Users", sel: ["#view .card.tw"],
        x: "Approve new accounts only after checking their ID. Forgot-password requests appear here: check their ID in person, then give a temporary password." },
      { t: "You're ready", page: "Dashboard", sel: "[data-tour=help]",
        x: "Reopen this tour any time with <b>How to use</b>." }
    ];

    let tourOn = false, tourI = 0;

    // Steps for this role: only pages it can open
    const tourSteps = () => TOUR.filter(s => (!s.page || MENU[role].includes(s.page)) && (!s.roles || s.roles.includes(role)));
    const tourEl = s => [].concat(s.sel || []).map(q => document.querySelector(q)).find(e => e && e.getClientRects().length);

    function tour(i) {
      const steps = tourSteps(), s = steps[i];
      if (!s) return endTour();
      if (!tourOn) {
        close_();
        tourOn = true;
        ["tourBlock", "tourHole", "tourTip"].forEach(id => $(id).style.display = "block");
        requestAnimationFrame(tourLoop);
      }
      tourI = i;
      const page = s.onPage || s.page;   // onPage: shown on a different page than the one it needs access to
      if (page && cur !== page) go(page);
      menu(false);

      const el = tourEl(s);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      $("tourHole").classList.toggle("key", !!s.key);

      const last = i === steps.length - 1;
      const dots = steps.map((_, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("");
      $("tourTip").innerHTML = `
        ${s.key ? `<span class="badge">★ Key step</span>` : ""}
        <div class="step">Step ${i + 1} of ${steps.length}${page ? " · " + page : ""}</div>
        <h3 style="margin:4px 0 6px">${s.t}</h3>
        <p style="margin:0">${typeof s.x === "function" ? s.x() : s.x}</p>
        ${s.demo ? `<div class="demo">
          <div class="x1"><span>Jose · PWD · very low income</span><b>#1</b></div>
          <div class="x2"><span>Carlo · PWD · high income</span><b>#2</b></div>
        </div>` : ""}
        <div class="dots">${dots}</div>
        <div style="display:flex;gap:8px">
          ${i ? `<button class="btn o" onclick="tour(${i - 1})">Back</button>` : ""}
          <button class="btn a" onclick="tour(${i + 1})">${last ? "Finish" : "Next"}</button>
          <button class="btn o" style="margin-left:auto" onclick="endTour()">Skip tour</button>
        </div>`;
    }

    function endTour() {
      tourOn = false;
      ["tourBlock", "tourHole", "tourTip"].forEach(id => $(id).style.display = "none");
    }

    // Follows the highlighted element every frame, so scrolling, resizing and live redraws keep it in place
    function tourLoop() {
      if (!tourOn) return;
      const s = tourSteps()[tourI], el = s && tourEl(s), hole = $("tourHole"), tip = $("tourTip"), pad = 6, gap = 12;
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      if (el) {
        const r = el.getBoundingClientRect();
        hole.classList.remove("none");
        Object.assign(hole.style, { left: r.left - pad + "px", top: r.top - pad + "px",
          width: r.width + pad * 2 + "px", height: r.height + pad * 2 + "px" });
        let top = r.bottom + pad + gap;                                    // below the element...
        if (top + th > innerHeight - gap) top = r.top - pad - gap - th;   // ...or above if there's no room
        if (top < gap) top = innerHeight - th - gap;                      // big element: bottom of the screen
        tip.style.top = Math.max(gap, top) + "px";
        tip.style.left = Math.min(Math.max(gap, r.left + r.width / 2 - tw / 2), innerWidth - tw - gap) + "px";
      } else {
        hole.classList.add("none");                                        // nothing to point at: center it
        Object.assign(hole.style, { left: "50%", top: "50%", width: "0px", height: "0px" });
        tip.style.left = (innerWidth - tw) / 2 + "px";
        tip.style.top = (innerHeight - th) / 2 + "px";
      }
      requestAnimationFrame(tourLoop);
    }

    addEventListener("keydown", e => {
      if (!tourOn) return;
      if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); tour(tourI + 1); }
      else if (e.key === "ArrowLeft" && tourI) tour(tourI - 1);
      else if (e.key === "Escape") endTour();
    });


    /* =========================================================
       PAGES
       ========================================================= */

    const V = {
      Dashboard() {
        const q = queue();

        // Items use different units (kg, L, pcs), so the dashboard counts families covered instead of adding amounts
        // Logistics sees only the goods side
        const stats = [
          ...(people() ? [
            [B.length, "Registered beneficiaries"],
            [q.length, "Waiting in queue"],
            [pend().length, "Need ID verification"]
          ] : [
            [I.length, "Relief items"],
            [M.length, "Stock adjustments"]
          ]),
          [D.length, "Distributions recorded"],
          [(f => f.length ? Math.min(...f.map(families)) : 0)(given().filter(x => x.basis === "family")),
            "Families stock can fully serve"],
          [I.filter(soon).length, "Items expiring within 7 days"],
          [I.filter(x => spoiled(x) > 0).length, "Items with expired stock"]
        ];

        const statCards = stats
          .map(x => `<div class="card stat"><b data-n="${x[0]}">0</b><span>${x[1]}</span></div>`)
          .join("");

        const stockBars = CATS.filter(c => I.some(x => x.cat === c)).map(c => `
          <p style="margin:14px 0 0;font-size:12px;color:var(--mu)"><b>${c}</b></p>` +
          I.filter(x => x.cat === c).map(x => `
          <p style="margin:6px 0 3px">${esc(x.item)} <span style="color:var(--mu)">· ${rem(x)} ${unit(x)} left of ${x.don} ${unit(x)}
            · ${reach(x)}</span>${soon(x) ? ` <span style="color:var(--p2)">· expires ${nextExp(x)}</span>` : ""}</p>
          <div class="bar"><i class="${level(x)}" style="width:${x.don ? rem(x) / x.don * 100 : 0}%"></i></div>`).join("")).join("");

        const next = q[0]
          ? esc(q[0].name) + " " + tag(q[0]) + ` <span style="color:var(--mu)">· ${INC[q[0].inc]}</span>`
          : "No one waiting";

        const expiredCount = I.filter(x => spoiled(x) > 0).length;
        return `
          <div class="grid" data-tour="stats">${statCards}</div>
          ${MENU[role].includes("Sites & Transfers") ? whereToSend() : ""}
          ${MENU[role].includes("Sites & Transfers") ? `
            <div class="card" data-tour="minimap">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
                <span><b>Sites at a glance</b> <span style="color:var(--mu)">· pin color = how many families each site can still serve</span></span>
                <button class="btn o s" onclick="go('Sites & Transfers')">Open full map</button>
              </div>
              <div id="dmap" class="map small" style="height:240px"></div>
              <div class="legend">
                <span><i style="background:var(--s-ok)"></i>Stocked (20+)</span>
                <span><i style="background:var(--s-low)"></i>Running low (1–19)</span>
                <span><i style="background:var(--s-crit)"></i>Out of stock</span>
                ${TR.some(t => t.status === "In transit") ? `<span>🚚 On the way (estimated)</span>` : ""}
                ${SITES.some(s => s.lat == null) ? `<span>· ${SITES.filter(s => s.lat == null).length} site(s) not placed yet</span>` : ""}
              </div>
            </div>` : ""}
          ${role !== "Volunteer" ? `<div data-tour="charts">${dashCharts()}</div>` : ""}
          ${logi() && expiredCount ? `<div class="card warn"><b>${expiredCount} item(s) have expired stock.</b>
            Write it off in <a style="cursor:pointer;text-decoration:underline" onclick="go('Inventory')">Inventory</a> so it isn't counted or handed out.</div>` : ""}
          <div class="card"><b>Inventory status</b>${stockBars}</div>
          ${people() ? `<div class="card"><b>Next in queue:</b> ${next}</div>` : ""}`;
      },

      Beneficiaries() {
        const rows = B.map(b => {
          const warn = !b.ver && b.flags.length
            ? ` <span class="tag t1" title="${esc(b.flags.join("\n"))}">${b.flags.length} warning${b.flags.length > 1 ? "s" : ""}</span>`
            : "";
          const status = !b.ver ? '<span class="tag t0">Needs ID check</span>' + warn
            : !canServe(b) ? `Served ${niceDate(b.last)}<br><span style="color:var(--mu);font-size:12px">Back in queue ${niceDate(nextServe(b))}</span>`
            : "In queue" + (b.last ? `<br><span style="color:var(--mu);font-size:12px">Last served ${niceDate(b.last)}</span>` : "");
          const actions = staff()
            ? (!b.ver ? `<button class="btn s" onclick="ver(${b.id})">Verify ID</button> `
                : `<button class="btn o s" onclick="printCards([${b.id}])" title="Print this family's QR claim card">Card</button>
                   <button class="btn o s" onclick="reissue(${b.id})" title="Lost card: make a new code. The old card stops working">New code</button> `)
              + `<button class="btn o s" onclick="moveSite(${b.id})" title="Change where this family claims relief">Site</button> `
              + (b.done ? "" : `<button class="btn o s" onclick="delB(${b.id})">Delete</button>`)
            : "";

          return `
            <tr>
              <td>${esc(b.name)}</td>
              <td>${esc(b.brgy)}</td>
              <td>${b.site ? esc(siteName(b.site)) : `<span style="color:var(--mu)">No site yet</span>`}</td>
              <td>${ageOf(b.dob)}</td>
              <td>${b.fam}</td>
              <td>${cats(b).map(esc).join("<br>")}</td>
              <td>${INC[b.inc]}</td>
              <td>${esc(b.idt.split(" ")[0])} ${mask(b.idn)}</td>
              <td>${tag(b)}</td>
              <td>${status}</td>
              <td style="color:var(--mu)">${esc(b.by)}${b.verBy ? " → " + esc(b.verBy) : ""}</td>
              <td>${actions}</td>
            </tr>`;
        }).join("");

        return `
          <div class="top">
            <span style="color:var(--mu)">Centralized beneficiary records</span>
            <div>
              ${staff() ? `<button class="btn o" data-tour="cards" onclick="printCards(B.filter(b => b.ver).map(b => b.id))">Print all claim cards</button>` : ""}
              <button class="btn a" data-tour="register" onclick="addB()">+ Register beneficiary</button>
            </div>
          </div>

          <div class="card tw">
            <table>
              <tr>
                <th>Name</th><th>Barangay</th><th>Claims at</th><th>Age</th><th>Family</th><th>Category</th>
